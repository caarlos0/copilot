version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  release:coding:
    desc: Release the coding plugin
    cmds:
      - task: release
        vars: {PLUGIN: coding}

  release:security:
    desc: Release the security plugin
    cmds:
      - task: release
        vars: {PLUGIN: security}

  release:fitness:
    desc: Release the fitness plugin
    cmds:
      - task: release
        vars: {PLUGIN: fitness}

  release:terminals:
    desc: Release the terminals plugin
    cmds:
      - task: release
        vars: {PLUGIN: terminals}

  release:coordination:
    desc: Release the coordination plugin
    cmds:
      - task: release
        vars: {PLUGIN: coordination}

  release:home:
    desc: Release the home plugin
    cmds:
      - task: release
        vars: {PLUGIN: home}

  release:
    internal: true
    vars:
      TAG:
        sh: svu next --always --tag.prefix "{{.PLUGIN}}/v" --tag.pattern "{{.PLUGIN}}/v*" --log.directory "plugins/{{.PLUGIN}}"
    preconditions:
      - sh: test "$(git symbolic-ref --short HEAD)" = main
        msg: "Releases must run from main."
      - sh: test -z "$(git status --porcelain)"
        msg: "Commit or stash changes before releasing."
    cmds:
      - |
        set -eu
        version="{{.TAG}}"
        version=${version#*/v}
        file="plugins/{{.PLUGIN}}/plugin.json"
        jq --arg version "$version" '.version = $version' "$file" > "$file.tmp"
        mv "$file.tmp" "$file"
        file=.github/plugin/marketplace.json
        jq --arg plugin "{{.PLUGIN}}" --arg version "$version" \
          '(.plugins[] | select(.name == $plugin)).version = $version' "$file" > "$file.tmp"
        mv "$file.tmp" "$file"
      - git add "plugins/{{.PLUGIN}}/plugin.json" .github/plugin/marketplace.json
      - 'git commit -s -m "release({{.PLUGIN}}): {{.TAG}}"'
      - git tag -a "{{.TAG}}" -m "{{.TAG}}"
      - git push --atomic origin main "refs/tags/{{.TAG}}"
