        document.getElementById("improve-heading").hidden = improve.length === 0;
        document.getElementById("producers-note").textContent = snapshot.status === "active" ? ""
          : `Scheduled rules do not run while the factory is ${snapshot.status}.`;
        const ignored = snapshot.ignored ?? [];
        document.getElementById("ignored-list").replaceChildren(...ignored.map((item) => {
          const entry = element("li");
          entry.append(reference(item.url), ...codeParts(` ${item.at.slice(0, 10)}: ${item.reason}`));
          return entry;
        }));
        document.getElementById("ignored-empty").hidden = ignored.length > 0;
      }

      // With `conditional`, the server's tag for this URL is kept and sent back; an
      // unchanged answer (304) returns `notModified`. The caller drops the tag with
      // `etags.delete(path)` when it does not apply the data it got.
      const notModified = Symbol("not modified");
      const etags = new Map();
      async function requestJSON(path, { conditional, ...options } = {}) {
        const headers = { ...options.headers, ...(conditional && etags.has(path) ? { "If-None-Match": etags.get(path) } : {}) };
        const response = await fetch(path, { ...options, headers, cache: "no-store" });
        if (conditional && response.status === 304) return notModified;
        const data = await response.json();
        if (!response.ok) throw new Error(data.error ?? `HTTP ${response.status}`);
        if (conditional && response.headers.get("ETag")) etags.set(path, response.headers.get("ETag"));
        return data;
      }

      function renderFactories() {
        const items = listed.map((item) => ({
          file: item.file, label: item.project, count: item.task_count,
          updated: item.file !== selection && seen[item.file] !== item.updated_at,
        }));
        if (selection && !listed.some((item) => item.file === selection)) {
          items.unshift({ file: selection, label: `Unavailable: ${selection}`, count: null, updated: false });
        }
        const signature = JSON.stringify([selection, items]);
        if (signature === listedChoices) return;
        listedChoices = signature;
        sidebar = items.map((item) => item.file);
        document.getElementById("factories").replaceChildren(...(items.length
          ? items.map((item, index) => {
            const button = element("button", null, "factory-item");
            button.type = "button";
            button.setAttribute("aria-current", String(item.file === selection));
            if (index < 9) {
              button.setAttribute("aria-keyshortcuts", String(index + 1));
              button.append(element("kbd", index + 1));
            }
            button.append(element("span", item.label, "name"));
            if (item.count !== null) button.append(element("span", item.count, "count"));
            if (item.updated) {
              const dot = element("span", null, "update-dot");
              dot.setAttribute("role", "img");
              dot.setAttribute("aria-label", "Updated");
              button.append(dot);
            }
            button.addEventListener("click", () => select(item.file));
            return button;
          })
          : [element("p", "No valid factories found", "muted")]));
      }

      let listing = null;
      async function discover() {
        const fetched = await requestJSON("/api/factories", { conditional: true });
        if (fetched === notModified) {
          document.getElementById("discovery-error").hidden = true;
          return listing;
        }
        const data = listing = fetched;
        listed = [...data.factories].sort(compareFactories);
        // The first sighting is the baseline: only later changes count as updates.
        for (const item of listed) {
          if (item.file === selection || !(item.file in seen)) seen[item.file] = item.updated_at;
        }
        renderFactories();
        document.getElementById("skipped").hidden = !data.errors.length;
        document.getElementById("skipped-files").replaceChildren(
          ...data.errors.map((error) => rich("li", `${error.file}: ${error.error}`)),
        );
        document.getElementById("discovery-error").hidden = true;
        return data;
      }

      function freshness() {
        const label = document.getElementById("freshness");
        if (!snapshot) {
          label.textContent = "";
          return;
        }
        const seconds = Math.max(0, Math.floor((Date.now() - lastRead) / 1000));
        label.textContent = seconds < 2 ? "refreshed just now"
          : `refreshed ${seconds < 60 ? `${seconds}s` : `${Math.floor(seconds / 60)}m`} ago`;
      }

      function showError(cause) {
        const error = document.getElementById("error");
        error.textContent = `Read failed: ${cause.message} ${lastSource
          ? `Showing the last successful snapshot of ${lastSource}; it may be stale.`
          : "No snapshot loaded."}`;
        error.hidden = false;
      }

      function load(data, file) {
        snapshot = data;
        lastSource = file;
        lastRead = Date.now();
        document.getElementById("error").hidden = true;
        document.getElementById("goal").textContent = data.project;
        const runStatus = document.getElementById("run-status");
        runStatus.textContent = data.status;
        runStatus.hidden = data.status === "active";
        document.title = `${data.project} - Factory`;
        draw();
        freshness();
      }

      async function refresh() {
        if (refreshing) {
          pendingRefresh = true;
          return;
        }
        refreshing = true;
        clearTimeout(refreshTimer);
        try {
          let found = null;
          try {
            found = await discover();
          } catch (cause) {
            const error = document.getElementById("discovery-error");
            error.textContent = `Could not list factories: ${cause.message}`;
            error.hidden = false;
          }
          if (!selection && found?.factories.length) {
            selection = found.factories[0].file;
            const url = new URL(location.href);
            url.searchParams.set("file", selection);
            history.replaceState(null, "", url);
            await discover();
          }
          const current = selection;
          if (current) {
            const path = `/api/factory?${new URLSearchParams({ file: current })}`;
            try {
              const version = mutation;
              const data = await requestJSON(path, { conditional: true });
              if (data === notModified) {
                if (current === selection && version === mutation && lastSource === current) {
                  lastRead = Date.now();
                  document.getElementById("error").hidden = true;
                  refreshElapsedLabels(document.getElementById("task-list"));
                  drawSource(snapshot.rules.filter((rule) => rule.enabled && isFinder(rule)));
                  if (producersOpen()) renderProducers();
                } else {
                  etags.delete(path);
                }
              } else {
                validate(data);
                if (current === selection && version === mutation) {
                  load(data, current);
                } else {
                  etags.delete(path);
                }
              }
            } catch (cause) {
              etags.delete(path);
              if (current === selection) showError(cause);
            }
          }
        } finally {
          refreshing = false;
          freshness();
          if (pendingRefresh) {
            pendingRefresh = false;
            return refresh();
          }
          refreshTimer = setTimeout(refresh, 30000);
        }
      }

      function select(file) {
        if (file === selection) return;
        selection = file;
        const item = listed.find((entry) => entry.file === file);
        if (item) seen[file] = item.updated_at;
        renderFactories();
        document.getElementById("global-filter").value = "";
        const url = new URL(location.href);
        url.searchParams.set("file", selection);
        url.hash = "";
        history.replaceState(null, "", url);
        renderDetail(null);
        snapshot = lastSource = null;
        etags.clear();
        renderFilterStatus(0);
        freshness();
        return refresh();
      }
      document.getElementById("refresh").addEventListener("click", refresh);
      document.getElementById("open-settings").addEventListener("click", openSettings);
      document.getElementById("global-filter").addEventListener("input", draw);
      window.addEventListener("hashchange", draw);
      const closeChoice = () => choose(null);
      document.getElementById("close-detail").addEventListener("click", closeChoice);
      document.addEventListener("keydown", onGlobalKey);
      paletteInput.addEventListener("keydown", onPaletteKey);
      paletteInput.addEventListener("input", renderPalette);
      wireDismiss(moveDialog, "close-move", closeMove);
      wireDismiss(settingsDialog, "close-settings", closeSettings);
      wireDismiss(paletteDialog, "close-palette", () => paletteDialog.close());

      document.getElementById("logo").src = document.getElementById("icon").href;
      setInterval(freshness, 1000);
      buildFlow();
      refresh();
    </script>
  </body>
</html>
