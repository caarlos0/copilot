<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link id="icon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f883d'/%3E%3Cpath d='M8 8h8v8h8m-8 0v8' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='8' cy='8' r='3' fill='white'/%3E%3Ccircle cx='16' cy='16' r='3' fill='white'/%3E%3Ccircle cx='24' cy='16' r='3' fill='white'/%3E%3Ccircle cx='16' cy='24' r='3' fill='white'/%3E%3C/svg%3E">
    <title>Factory</title>
    <style>
      /* GitHub Primer tokens, inlined so the loopback page needs no network. */
      :root {
        color-scheme: light dark;
        --fg: #1f2328;
        --fg-muted: #59636e;
        --bg: #fff;
        --bg-muted: #f6f8fa;
        --code-bg: rgba(175, 184, 193, .2);
        --border: #d1d9e0;
        --border-emphasis: #818b98;
        --btn-bg: #f6f8fa;
        --btn-hover: #eff2f5;
        --btn-primary: #1f883d;
        --btn-primary-hover: #1a7f37;
        --accent: #0969da;
        --success: #1a7f37;
        --attention: #9a6700;
        --danger: #d1242f;
        --done: #8250df;
        --neutral: #59636e;
        --initial: var(--neutral);
        --investigation: var(--accent);
        --implementation: var(--success);
        --review: var(--attention);
        --blocked: var(--danger);
        --resolved: var(--done);
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif,
          "Apple Color Emoji", "Segoe UI Emoji";
        font-size: 14px;
        line-height: 1.5;
        color: var(--fg);
        background: var(--bg);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f0f6fc;
          --fg-muted: #9198a1;
          --bg: #0d1117;
          --bg-muted: #151b23;
          --code-bg: rgba(110, 118, 129, .4);
          --border: #3d444d;
          --border-emphasis: #656c76;
          --btn-bg: #212830;
          --btn-hover: #262c36;
          --btn-primary: #238636;
          --btn-primary-hover: #29903b;
          --accent: #4493f8;
          --success: #3fb950;
          --attention: #d29922;
          --danger: #f85149;
          --done: #ab7df8;
          --neutral: #9198a1;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; height: 100vh; display: flex; flex-direction: column; }
      .bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding: 12px 24px;
        border-bottom: 1px solid var(--border); background: var(--bg-muted); }
      .brand { display: flex; align-items: center; gap: 10px; }
      .brand img { display: block; width: 28px; height: 28px; }
      h1 { margin: 0; font-size: 20px; font-weight: 600; }
      .refresh { display: flex; align-items: center; gap: 12px; margin-left: auto; }
      .layout { display: grid; grid-template-columns: 240px minmax(0, 1fr) auto;
        grid-template-rows: minmax(0, 1fr); flex: 1; min-height: 0; }
      #factories { grid-column: 1; display: flex; flex-direction: column; gap: 2px; padding: 16px 12px;
        overflow-y: auto; border-right: 1px solid var(--border); }
      #factories p { margin: 4px 12px; }
      .factory-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 12px; text-align: left;
        background: transparent; border-color: transparent; font-weight: 400; }
      .factory-item:hover:not(:disabled) { background: var(--btn-hover); }
      .factory-item[aria-current="true"] { background: var(--btn-bg); border-color: var(--border); font-weight: 600; }
      .factory-item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .factory-item kbd { flex: none; font: 11px/10px var(--mono); padding: 3px 5px; color: var(--fg-muted);
        background: var(--btn-bg); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 6px; }
      .factory-item .count { color: var(--fg-muted); font-size: 12px; }
      .update-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
      main { grid-column: 2; padding: 24px 32px; max-width: 1280px; overflow: auto; }
      #detail { grid-column: 3; width: clamp(420px, 34vw, 520px); overflow-y: auto; border-left: 1px solid var(--border); }
      #detail:focus { outline: none; }
      h2 { margin: 0; font-size: 20px; font-weight: 400; }
      h3 { margin: 0; font-size: 16px; font-weight: 600; }
      p { margin: 8px 0; }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      .ref { display: inline-flex; align-items: center; gap: 4px; }
      .ref svg { flex: none; fill: currentColor; }
      label { display: block; margin-bottom: 4px; font-weight: 600; }
      code { font-family: var(--mono); font-size: 85%; line-height: 1.9; padding: .2em .4em; border-radius: 6px; background: var(--code-bg);
        white-space: break-spaces; overflow-wrap: anywhere;
        -webkit-box-decoration-break: clone; box-decoration-break: clone; }
      pre { font-family: var(--mono); font-size: 12px; }
      button, select, textarea, input { font: inherit; line-height: 20px; color: var(--fg); border: 1px solid var(--border); border-radius: 6px; }
      button { padding: 5px 16px; font-weight: 500; background: var(--btn-bg); cursor: pointer; }
      button:hover:not(:disabled) { background: var(--btn-hover); }
      .action-primary { color: #fff; background: var(--btn-primary); border-color: rgb(31 35 40 / .15); }
      .action-primary:hover:not(:disabled) { background: var(--btn-primary-hover); }
      select { width: 480px; max-width: 100%; padding: 5px 12px; background: var(--bg); }
      textarea { width: 100%; padding: 8px 12px; background: var(--bg); resize: vertical; }
      input[type="search"] { width: 100%; padding: 5px 12px; background: var(--bg); }
      button:disabled { opacity: .6; cursor: default; }
      .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
      .muted { color: var(--fg-muted); }
      a:focus-visible, button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible, summary:focus-visible,
      .node:focus-visible, .outcome:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .node:focus-visible, .outcome:focus-visible { outline-offset: 4px; }
      #error, #discovery-error, .save-error { padding: 16px; border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent);
        border-radius: 6px; background: color-mix(in srgb, var(--danger) 10%, var(--bg)); }

      #flow { width: 100%; min-width: 720px; height: auto; max-height: 70vh; display: block; }
      .edge { fill: none; stroke: var(--border-emphasis); stroke-width: 1.5; opacity: .6; }
      .edge.lit { stroke: var(--accent); stroke-width: 2; opacity: 1; }
      .port { fill: var(--border-emphasis); stroke: var(--bg); stroke-width: 1; pointer-events: none; opacity: .6; }
      .port.lit { fill: var(--accent); opacity: 1; }

      .node { cursor: pointer; }
      .node .box { fill: color-mix(in srgb, var(--c) 8%, var(--bg)); stroke: color-mix(in srgb, var(--c) 45%, var(--border));
        stroke-width: 1; }
      .node:hover .box { fill: color-mix(in srgb, var(--c) 14%, var(--bg)); }
      .node.active .box { stroke: var(--c); }
      .node.selected .box { stroke: var(--c); stroke-width: 2; fill: color-mix(in srgb, var(--c) 14%, var(--bg)); }
      .node .bar { fill: var(--c); pointer-events: none; }
      .node .name { fill: var(--c); font-size: 14px; font-weight: 600; text-anchor: middle; }
      .node .count { fill: var(--fg); font-size: 40px; font-weight: 600; text-anchor: middle; }
      .node .sub { fill: var(--fg-muted); font-size: 12px; text-anchor: middle; }
      .node.source .box { stroke-dasharray: 4 3; }
      .outcome { cursor: pointer; }
      .outcome rect { fill: transparent; stroke: color-mix(in srgb, var(--resolved) 45%, var(--border)); stroke-width: 1; }
      .outcome:hover rect, .outcome.selected rect { fill: color-mix(in srgb, var(--resolved) 14%, var(--bg)); }
      .outcome text { fill: var(--fg-muted); font-size: 12px; }
      .outcome.selected text { fill: var(--resolved); }
      .outcome .outcome-count { fill: var(--fg); font-weight: 600; text-anchor: end; font-variant-numeric: tabular-nums; }

      dialog { width: min(960px, calc(100% - 32px)); max-height: 85vh; padding: 0;
        color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 12px; }
      dialog:focus { outline: none; }
      dialog::backdrop { background: rgb(0 0 0 / .5); }
      #move-dialog, #settings-dialog { width: min(560px, calc(100% - 32px)); }
      #palette-dialog { width: min(720px, 92vw); margin-top: 12vh; }
      #palette-input { flex: 1; min-width: 0; padding: 5px 12px; background: var(--bg); }
      #palette-list { list-style: none; margin: 0; padding: 0; max-height: 50vh; overflow-y: auto; }
      #palette-dialog .detail-head { align-items: center; }
      #palette-list li { padding: 10px 24px; cursor: pointer; overflow-wrap: anywhere; }
      #palette-list li[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 14%, var(--bg)); }
      #palette-list .option-title { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
      #palette-list .option-title > :first-child { flex: 1; min-width: 0; }
      #palette-list .chip { flex: none; white-space: nowrap; }
      #palette-list .option-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; margin: 4px 0 0; font-size: 12px; }
      #palette-status { margin: 0; padding: 8px 24px 12px; border-top: 1px solid var(--border); }
      .task-row.task-flash { outline: 2px solid var(--accent); outline-offset: -2px; }
      @media (prefers-reduced-motion: no-preference) {
        .task-row.task-flash { animation: task-flash 1.2s ease-out; }
      }
      @keyframes task-flash { from { background: color-mix(in srgb, var(--accent) 25%, transparent); } }
      #title-row { display: flex; align-items: center; gap: 8px; }
      .icon-button { display: inline-flex; flex: none; align-items: center; justify-content: center;
        width: 32px; height: 32px; padding: 0; line-height: 1; }
      .icon-button svg { display: block; }
      #title-pill { display: flex; align-items: stretch; border: 1px solid var(--border); border-radius: 6px; background: var(--btn-bg); }
      #title-pill h2 { display: flex; align-items: center; padding: 4px 12px; font-weight: 600; overflow-wrap: anywhere; }
      #open-settings { height: auto; border: 0; border-left: 1px solid var(--border); border-radius: 0 5px 5px 0; }
      #open-settings:focus-visible { outline-offset: -2px; }
      .settings-form h3 { margin: 24px 0 4px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 14px; }
      .settings-form h3:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
      .settings-form input { display: block; width: 100%; margin-top: 4px; padding: 5px 12px; background: var(--bg); font-weight: 400; }
      .settings-form label { margin-top: 12px; }
      .settings-form p.muted { margin: 4px 0 12px; }
      .settings-form .controls { margin-top: 24px; }
      #rule-list, #improve-list, #ignored-list { list-style: none; margin: 0; padding: 0; }
      #producers-note { margin: 16px 24px 0; }
      #producers-note:empty { display: none; }
      #producers-view h3.section { margin: 0; padding: 16px 24px 0; border-top: 1px solid var(--border); }
      #ignored-list li, #ignored-empty { padding: 8px 24px; overflow-wrap: anywhere; }
      #ignored-empty { margin: 0; }
      body:has(dialog[open]) { overflow: hidden; }
      .detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
        position: sticky; top: 0; z-index: 1; padding: 16px 24px; background: var(--bg-muted);
        border-bottom: 1px solid var(--border); }
      .detail-head h2 { flex: 1; min-width: 0; overflow-wrap: anywhere; }
      .close-button { font-size: 24px; color: var(--fg-muted); background: transparent; border-color: transparent; }
      .move-form .controls { justify-content: flex-end; }
      #detail-empty { margin: 16px 24px; }
      .global-filter { display: flex; flex: 1; align-items: center; gap: 8px; max-width: 560px; min-width: 200px; }
      .global-filter input { flex: none; width: 280px; max-width: 100%; }
      #global-filter-count { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #detail-filter-count { margin: 8px 24px; }
      .counter { display: inline-block; min-width: 20px; margin-left: 8px; padding: 0 6px; border-radius: 2em;
        background: color-mix(in srgb, var(--neutral) 20%, transparent); font-size: 12px; font-weight: 500;
        line-height: 18px; text-align: center; vertical-align: middle; }
      #task-list { list-style: none; margin: 0; padding: 0; }
      .task-row { padding: 16px 24px; overflow-wrap: anywhere; }
      .task-row + .task-row { border-top: 1px solid var(--border); }
      .row-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
      .row-head h3 { flex: 1; min-width: 0; }
      .chips, .links { display: flex; flex-wrap: wrap; gap: 4px 8px; }
      .chip { padding: 0 7px; border: 1px solid var(--border); border-radius: 2em; color: var(--fg-muted);
        font-size: 12px; font-weight: 500; line-height: 18px; }
      .chip.state { color: var(--c); border-color: var(--c); }
      .feedback-note { white-space: pre-wrap; border-left: 3px solid var(--accent); padding-left: 12px; }
      .move { flex: none; padding: 3px 12px; font-size: 12px; }
      .move-form { padding: 16px 24px; }
      .move-form fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
      .move-form label + label { margin-top: 12px; }
      .move-form label[hidden] { display: none; }
      .move-form select, .move-form textarea { display: block; width: 100%; margin-top: 4px; font-weight: 400; }
      .unblock-context { margin: 0 0 12px; padding: 8px 12px; border-left: 3px solid var(--attention); background: var(--bg-muted); }
      .unblock-context p { margin: 0; }
      .unblock-context .unblock-reason { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 40vh; overflow: auto; }
      .unblock-notes { margin: 8px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--fg-muted);
        white-space: pre-wrap; overflow-wrap: anywhere; }
      .unblock-options { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
      .unblock-options p { margin: 0; }
      .unblock-options button { display: block; width: 100%; text-align: left; font-weight: 400;
        white-space: normal; overflow-wrap: anywhere; }
      .unblock-options button[aria-pressed="true"] { border-color: var(--accent); }
      .unblock-options .tag { margin-left: 8px; color: var(--fg-muted); font-size: 12px; }
      .save-error { white-space: pre-wrap; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--neutral); }
      .dot.running { background: var(--success); }
      .dot.unknown { background: var(--attention); }
      ul.workers { margin: 8px 0; padding-left: 20px; }
      h4 { margin: 12px 0 0; font-size: 12px; font-weight: 600; color: var(--fg-muted); }
      ol.history { margin: 8px 0; padding: 0; list-style: none; font-size: 12px; }
      .history-gap { position: relative; display: flex; align-items: center; gap: 8px; min-height: 22px; margin-left: 24px;
        padding-left: 14px; border-left: 2px dashed var(--border-emphasis); color: var(--fg-muted); font-size: 11px;
        font-variant-numeric: tabular-nums; }
      .history-gap::after { content: ""; position: absolute; left: -6px; bottom: -2px; border: 5px solid transparent;
        border-top: 6px solid var(--border-emphasis); border-bottom-width: 0; }
      .history-node { padding: 6px 10px; border: 1px solid color-mix(in srgb, var(--c) 45%, var(--border)); border-radius: 6px;
        background: color-mix(in srgb, var(--c) 8%, var(--bg)); }
      .history-node.operator { border-style: dashed; }
      .history-state { font-weight: 600; color: var(--c); }
      .history-time, .history-note { color: var(--fg-muted); }
      .history-note { margin: 2px 0 0; }
      .history-badge { margin-left: 6px; padding: 0 6px; border: 1px solid var(--border-emphasis); border-radius: 999px;
        color: var(--fg-muted); font-size: 11px; }
      details.history-earlier { margin: 8px 0; font-size: 12px; }
      summary { cursor: pointer; color: var(--fg-muted); }
      pre { padding: 16px; border-radius: 6px; background: var(--bg-muted); white-space: pre-wrap; }
      /* Primer "prettylights" syntax colours. */
      .json-key { color: #116329; }
      .json-string { color: #0a3069; }
      .json-literal { color: #0550ae; }
      @media (prefers-color-scheme: dark) {
        .json-key { color: #7ee787; }
        .json-string { color: #a5d6ff; }
        .json-literal { color: #79c0ff; }
      }
      @media (max-width: 700px) {
        body { height: auto; display: block; }
        .layout { grid-template-columns: 1fr; grid-template-rows: none; }
        #factories, #detail, main { grid-column: 1; }
        #detail { width: auto; overflow: visible; border-left: 0; border-top: 1px solid var(--border); }
        #factories { flex-direction: row; flex-wrap: wrap; overflow: visible; border-right: 0; border-bottom: 1px solid var(--border); }
        .factory-item { width: auto; }
        .refresh { margin-left: 0; }
      }
      @media (max-width: 600px) { main { padding: 16px; } .detail-head, .task-row { padding: 16px; } }
    </style>
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <img id="logo" alt="" width="28" height="28">
        <h1>Factory</h1>
      </div>
      <div class="global-filter">
        <input id="global-filter" type="search" autocomplete="off" placeholder="Filter tasks"
          aria-label="Filter tasks" aria-describedby="global-filter-count">
        <p id="global-filter-count" class="muted" role="status" hidden></p>
      </div>
      <div class="refresh">
        <span id="freshness" class="muted"></span>
        <button id="refresh" type="button">Refresh now</button>
      </div>
    </header>
    <div class="layout">
    <nav id="factories" aria-label="Factories"></nav>
    <main>
      <div id="title-row">
        <div id="title-pill">
          <h2 id="goal"></h2>
          <button id="open-settings" class="icon-button" type="button" aria-label="Settings" title="Settings">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M4.427 7.427 7.573 10.573a.6.6 0 0 0 .854 0l3.146-3.146A.25.25 0 0 0 11.396 7H4.604a.25.25 0 0 0-.177.427Z"/>
            </svg>
          </button>
        </div>
        <span id="run-status" class="chip" hidden></span>
      </div>
      <p id="discovery-error" role="alert" hidden></p>
      <details id="skipped" hidden>
        <summary>Some factories could not be listed</summary>
        <ul id="skipped-files"></ul>
      </details>
      <p id="error" role="alert" hidden></p>
      <svg id="flow" viewBox="0 0 1160 560" role="group" aria-label="Factory flow: tasks per state"></svg>
      <dialog id="move-dialog" aria-labelledby="move-title">
        <div class="detail-head">
          <h2 id="move-title"></h2>
          <button id="close-move" class="icon-button close-button" type="button" tabindex="-1"
            aria-label="Cancel move" title="Cancel move">&times;</button>
        </div>
        <div id="move-body"></div>
      </dialog>
      <dialog id="palette-dialog" aria-label="Go to task">
        <div class="detail-head">
          <input id="palette-input" type="text" autocomplete="off" placeholder="Go to task" aria-label="Go to task"
            role="combobox" aria-expanded="true" aria-autocomplete="list" aria-controls="palette-list">
          <button id="close-palette" class="icon-button close-button" type="button" tabindex="-1"
            aria-label="Close palette" title="Close palette">&times;</button>
        </div>
        <ul id="palette-list" role="listbox" aria-label="Tasks"></ul>
        <p id="palette-status" class="muted" role="status"></p>
      </dialog>
      <dialog id="settings-dialog" aria-labelledby="settings-title">
        <div class="detail-head">
          <h2 id="settings-title">Settings</h2>
          <button id="close-settings" class="icon-button close-button" type="button" tabindex="-1"
            aria-label="Cancel settings change" title="Cancel settings change">&times;</button>
        </div>
        <div id="settings-body"></div>
      </dialog>
    </main>
    <aside id="detail" aria-labelledby="detail-title" tabindex="-1" hidden>
      <div class="detail-head">
        <h2 id="detail-title"></h2>
        <button id="close-detail" class="icon-button close-button" type="button"
          aria-label="Close task list" title="Close task list">&times;</button>
      </div>
      <div id="task-view">
        <p id="detail-filter-count" class="muted" role="status"></p>
        <ul id="task-list"></ul>
        <p id="detail-empty" class="muted" hidden>No tasks in this state.</p>
      </div>
      <div id="producers-view" hidden>
        <p id="producers-note" class="muted"></p>
        <ul id="rule-list"></ul>
        <h3 id="improve-heading" class="section">Self-improve</h3>
        <ul id="improve-list"></ul>
        <h3 class="section">Skipped</h3>
        <ul id="ignored-list"></ul>
        <p id="ignored-empty" class="muted" hidden>Nothing skipped.</p>
      </div>
    </aside>
    </div>
    <noscript>Enable JavaScript to read the factory.</noscript>
    <script type="module">
      import { states, outcomes, transitions, artifactName, githubURL, validate, countByState, entered, byRecency, rankTasks, compareFactories, sortReferences, cyclesOf, operatorStates, operatorOutcomes, unblockState, unblockChoice, stripRecommended, nextRun, nextDue, leverSpends, leverAutonomyCaps, maxParallelWorkers, maxRoleLimit, digitIndex } from "./factory-data.mjs";

      const SVG = "http://www.w3.org/2000/svg";
      const NODE = { w: 160, h: 110 };
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const outcomeTitles = Object.fromEntries(outcomes.map((outcome) =>
        [outcome, outcome[0].toUpperCase() + outcome.slice(1).replaceAll("-", " ")]));
      // Nodes sit on a grid: columns 240 apart, an 80 gap between boxes.
      const places = {
        initial: { x: 20, y: 210, title: "Initial" },
        investigation: { x: 260, y: 210, title: "Investigation" },
        implementation: { x: 500, y: 210, title: "Implementation" },
        review: { x: 740, y: 210, title: "Review" },
        resolved: { x: 980, y: 210, title: "Resolved" },
        blocked: { x: 500, y: 430, title: "Blocked" },
      };
      const centre = (state) => ({ x: places[state].x + NODE.w / 2, y: places[state].y + NODE.h / 2 });
      const SOURCE = { x: 20, y: 20, w: NODE.w, h: NODE.h };
      // Routes are lists of points joined by straight segments, so every corner is square.
      const pathOf = (points) => `M${points.map(([x, y]) => `${x},${y}`).join(" L")}`;
      const row = centre("initial").y;
      const rowTop = places.initial.y;
      const bottom = rowTop + NODE.h;
      const across = (from, to, y = row) => [[places[from].x + NODE.w, y], [places[to].x, y]];
      const SHORTCUT = [
        [centre("investigation").x, rowTop], [centre("investigation").x, rowTop - 40],
        [centre("resolved").x, rowTop - 40], [centre("resolved").x, rowTop],
      ];
      const SOURCE_ROUTE = [[centre("initial").x, SOURCE.y + SOURCE.h], [centre("initial").x, rowTop]];
      const flowRoutes = {
        "initial>investigation": across("initial", "investigation"),
        "initial>review": [
          [places.initial.x + NODE.w - 30, rowTop], [places.initial.x + NODE.w - 30, rowTop - 60],
          [centre("review").x, rowTop - 60], [centre("review").x, rowTop],
        ],
        "investigation>implementation": across("investigation", "implementation"),
        "implementation>review": across("implementation", "review"),
        "review>resolved": across("review", "resolved"),
      };
      // One line joins each state to Blocked. Slots on Blocked are 20 apart in the same order as
      // the states, and the farther a state is from Blocked, the lower its bus, so no line crosses another.
      const blockedLanes = {
        initial: { bus: bottom + 70, slot: 540 },
        investigation: { bus: bottom + 40, slot: 560 },
        implementation: { slot: centre("blocked").x },
        review: { bus: bottom + 40, slot: 600 },
      };
      for (const [state, { bus, slot }] of Object.entries(blockedLanes)) {
        const x = centre(state).x;
        flowRoutes[`${state}>blocked`] = bus === undefined
          ? [[x, bottom], [x, places.blocked.y]]
          : [[x, bottom], [x, bus], [slot, bus], [slot, places.blocked.y]];
      }

      let selection = new URLSearchParams(location.search).get("file") ?? "";
      let snapshot = null;
      let lastSource = null;
      let lastRead = null;
      let refreshTimer = null;
      let refreshing = false;
      let pendingRefresh = false;
      let listedChoices = "";
      let sidebar = [];
      let listed = [];
      const seen = {};
      let mutation = 0;

      const flow = document.getElementById("flow");
      const panel = document.getElementById("detail");
      const moveDialog = document.getElementById("move-dialog");
      const settingsDialog = document.getElementById("settings-dialog");
      const paletteDialog = document.getElementById("palette-dialog");
      function element(tag, value, className) {
        const node = document.createElement(tag);
        if (value != null) node.textContent = value;
        if (className) node.className = className;
        return node;
      }

      // Backticked text wins; otherwise a UUID, a block:/window:/pane: ID, a hex SHA with a digit and a letter, a path or a file name.
      const CODE = /`([^`\n]+)`|\b(?:(?:block|window|session|pane):)?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b|\b(?:block|window|pane):[\w-]+|\b(?=[0-9a-f]*\d)(?=[0-9a-f]*[a-f])[0-9a-f]{7,40}\b|(?<![\w/.:~<-])(?:~|\.{1,2})?(?:\/[\w@.+-]*[\w@+-])+\/?|\b[\w.-]+\.(?:mjs|cjs|js|json|jsonl|md|html|yml|yaml|sh)\b/g;

      // A GitHub URL, `owner/repo#N`, or `#N`; plain `#N` and hashes need a GitHub `owner/repo` project.
      const REFS = /https:\/\/github\.com\/[^\s<>()`]*[^\s<>()`.,;:!?'"]|(?<![\w./-])([\w.-]+\/[\w.-]+)#(\d+)\b|(?<![\w#&])#(\d+)\b/g;
      const SHA = /^(?=[0-9a-f]*\d)(?=[0-9a-f]*[a-f])[0-9a-f]{7,40}$/;

      function githubLink(label, href) {
        const node = link(label, href);
        node.target = "_blank";
        node.rel = "noopener noreferrer";
        node.addEventListener("click", (event) => event.stopPropagation());
        return node;
      }

      const projectRepo = () => /^[\w.-]+\/[\w.-]+$/.test(snapshot?.project ?? "") ? snapshot.project : null;

      function linkify(text) {
        const repo = projectRepo();
        const parts = [];
        let last = 0;
        for (const match of text.matchAll(REFS)) {
          const target = match[1] ?? repo;
          const href = match[0].startsWith("https:") ? match[0] : target && `https://github.com/${target}/issues/${match[2] ?? match[3]}`;
          if (!href) continue;
          if (match.index > last) parts.push(text.slice(last, match.index));
          parts.push(githubLink(match[0], href));
          last = match.index + match[0].length;
        }
        if (last < text.length) parts.push(text.slice(last));
        return parts;
      }

      function chip(text) {
        const node = element("code");
        const repo = SHA.test(text) ? projectRepo() : null;
        const linked = repo ? [githubLink(text, `https://github.com/${repo}/commit/${text}`)] : linkify(text);
        if (linked.length === 1 && typeof linked[0] !== "string") node.append(linked[0]);
        else node.textContent = text;
        return node;
      }

      function codeParts(text) {
        const value = String(text);
        const parts = [];
        let last = 0;
        for (const match of value.matchAll(CODE)) {
          if (match.index > last) parts.push(...linkify(value.slice(last, match.index)));
          parts.push(chip(match[1] ?? match[0]));
          last = match.index + match[0].length;
        }
        if (last < value.length) parts.push(...linkify(value.slice(last)));
        return parts;
      }

      function rich(tag, text, className) {
        const node = element(tag, null, className);
        node.append(...codeParts(text));
        return node;
      }

      function link(label, href) {
        const node = element("a", label);
        node.href = href;
        return node;
      }

      function svg(tag, attributes = {}, text) {
        const node = document.createElementNS(SVG, tag);
        for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value);
        if (text != null) node.textContent = text;
        return node;
      }

      function openState() {
        const [state, outcome] = location.hash.slice(1).split("/");
        if (outcome && (state !== "resolved" || !outcomes.includes(outcome))) return null;
        return states.includes(state) ? state : null;
      }

      function openOutcome() {
        const outcome = location.hash.split("/")[1];
        return openState() === "resolved" && outcomes.includes(outcome) ? outcome : null;
      }

      function setHash(hash) {
        history.replaceState(null, "", `${location.pathname}${location.search}${hash}`);
        draw();
      }

      function choose(state, outcome = null) {
        const same = openState() === state && openOutcome() === outcome;
        setHash(!state || same ? "" : `#${state}${outcome ? `/${outcome}` : ""}`);
      }

      const producersOpen = () => location.hash === "#producers";
      const isFinder = (rule) => rule.kind !== "improve";
      const chooseProducers = () => setHash(producersOpen() ? "" : "#producers");

      function activateOnKey(node, action) {
        node.addEventListener("click", action);
        node.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            action();
          }
        });
      }

      function buildFlow() {
        const edges = svg("g", { id: "edges" });
        const ports = svg("g", { id: "ports" });
        // `links` lists the states whose hover or focus lights the line; it defaults to its two ends.
        const edge = (key, route, links = key.split(">")) => {
          const node = svg("path", { d: pathOf(route), class: "edge link" });
          node.dataset.edge = key;
          node.dataset.links = links.join(" ");
          edges.append(node);
          for (const [x, y] of [route[0], route.at(-1)]) {
            const port = svg("circle", { cx: x, cy: y, r: 3, class: "port link" });
            port.dataset.links = node.dataset.links;
            ports.append(port);
          }
        };
        edge("initial>investigation", flowRoutes["initial>investigation"]);
        edge("initial>review", flowRoutes["initial>review"]);
        edge("investigation>implementation", flowRoutes["investigation>implementation"]);
        edge("implementation>review", flowRoutes["implementation>review"]);
        edge("review>resolved", flowRoutes["review>resolved"]);
        // The long line over the top stands for every move to Resolved that has no line of its own.
        edge("shortcut", SHORTCUT, ["resolved", ...states.filter((state) =>
          state !== "review" && state !== "blocked" && transitions[state].includes("resolved"))]);
        edge("source>initial", SOURCE_ROUTE, ["source", "initial"]);
        for (const state of Object.keys(blockedLanes)) edge(`${state}>blocked`, flowRoutes[`${state}>blocked`]);
        const nodes = svg("g", { id: "nodes" });
        const source = svg("g", {
          class: "node source", tabindex: 0, role: "button", style: "--c: var(--accent)",
        });
        source.dataset.source = "producers";
        source.append(
          svg("rect", { class: "box", x: SOURCE.x, y: SOURCE.y, width: SOURCE.w, height: SOURCE.h }),
          svg("rect", { class: "bar", x: SOURCE.x, y: SOURCE.y, width: SOURCE.w, height: 4 }),
          svg("text", { class: "name", x: SOURCE.x + SOURCE.w / 2, y: SOURCE.y + 28 }, "Find work"),
          svg("text", { class: "count", x: SOURCE.x + SOURCE.w / 2, y: SOURCE.y + 76 }, "0"),
          svg("text", { class: "sub", x: SOURCE.x + SOURCE.w / 2, y: SOURCE.y + 98 }, ""),
        );
        activateOnKey(source, chooseProducers);
        lightOnHover(source, "source");
        nodes.append(source);
        for (const state of states) {
          const place = places[state];
          const group = svg("g", {
            class: "node", tabindex: 0, role: "button", style: `--c: var(--${state})`,
          });
          group.dataset.state = state;
          group.append(
            svg("rect", { class: "box", x: place.x, y: place.y, width: NODE.w, height: NODE.h }),
            svg("rect", { class: "bar", x: place.x, y: place.y, width: NODE.w, height: 4 }),
            svg("text", { class: "name", x: place.x + NODE.w / 2, y: place.y + 28 }, place.title),
            svg("text", { class: "count", x: place.x + NODE.w / 2, y: place.y + 76 }, "0"),
            svg("text", { class: "sub", x: place.x + NODE.w / 2, y: place.y + 98 }, ""),
          );
          activateOnKey(group, () => choose(state));
          lightOnHover(group, state);
          nodes.append(group);
        }

        const resolutions = svg("g", { role: "group", "aria-label": "Resolved tasks by outcome" });
        outcomes.forEach((outcome, index) => {
          const x = places.resolved.x;
          const y = places.resolved.y + NODE.h + index * 28;
          const group = svg("g", { class: "outcome", tabindex: 0, role: "button" });
          group.dataset.outcome = outcome;
          group.append(
            svg("rect", { x, y, width: NODE.w, height: 28 }),
            svg("text", { x: x + 12, y: y + 19 }, outcomeTitles[outcome]),
            svg("text", { class: "outcome-count", x: x + NODE.w - 12, y: y + 19 }, "0"),
          );
          activateOnKey(group, () => choose("resolved", outcome));
          resolutions.append(group);
        });

        flow.replaceChildren(edges, nodes, ports, resolutions);
      }

      // Lights the lines a state can take, and the moves back into it, while it has the pointer or focus.
      function lightOnHover(node, state) {
        const light = (on) => {
          for (const link of flow.querySelectorAll(".link")) {
            link.classList.toggle("lit", on && link.dataset.links.split(" ").includes(state));
          }
        };
        node.addEventListener("mouseenter", () => light(true));
        node.addEventListener("mouseleave", () => light(false));
        node.addEventListener("focus", () => light(true));
        node.addEventListener("blur", () => light(false));
      }

      function nodeOf(state) {
        return flow.querySelector(`.node[data-state="${state}"]`);
      }

      function draw() {
        if (!snapshot) return;
        const tasks = filteredTasks();
        renderFilterStatus(tasks.length);
        const chosen = openState();
        const counts = countByState(tasks);
        for (const state of states) {
          const group = nodeOf(state);
          group.querySelector(".count").textContent = String(counts[state]);
          group.classList.toggle("selected", chosen === state);
          const stateTasks = tasks.filter((task) => task.state === state);
          const running = stateTasks.reduce((sum, task) => sum + Object.values(task.workers)
            .filter((worker) => worker?.status === "running").length, 0);
          const live = state === "blocked" ? stateTasks.length > 0 : running > 0;
          group.classList.toggle("active", live);
          const idle = { initial: "queued", blocked: "needs a decision", resolved: "done" }[state] ?? "waiting";
          group.querySelector(".sub").textContent = stateTasks.length ? idle : "";
          group.setAttribute("aria-label",
            `${places[state].title}: ${stateTasks.length} ${stateTasks.length === 1 ? "task" : "tasks"}`);
        }
        for (const group of flow.querySelectorAll(".outcome")) {
          const outcome = group.dataset.outcome;
          const count = tasks.filter((task) => task.resolution?.outcome === outcome).length;
          const selected = openOutcome() === outcome;
          group.querySelector(".outcome-count").textContent = String(count);
          group.classList.toggle("selected", selected);
          group.setAttribute("aria-pressed", String(selected));
          group.setAttribute("aria-label",
            `Resolved: ${outcomeTitles[outcome]}, ${count} ${count === 1 ? "task" : "tasks"}`);
        }
        const enabled = snapshot.rules.filter((rule) => rule.enabled && isFinder(rule));
        drawSource(enabled);
        renderDetail(chosen, tasks);
      }

      function drawSource(enabled) {
        const group = flow.querySelector(".source");
        const due = nextDue({ ...snapshot, rules: snapshot.rules.filter(isFinder) });
        group.classList.toggle("selected", producersOpen());
        group.querySelector(".count").textContent = String(enabled.length);
        group.querySelector(".sub").textContent = due === null ? "on request" : dueIn(due);
        group.setAttribute("aria-label", `Find work: ${enabled.length} enabled ${enabled.length === 1 ? "rule" : "rules"}`);
      }

      function age(time) {
        return span(Math.max(0, Math.floor((Date.now() - Date.parse(time)) / 1000)));
      }

      function elapsedLabel(time, suffix = "") {
        const label = element("span", `${age(time)}${suffix}`, "elapsed-age");
        label.dataset.time = time;
        label.dataset.suffix = suffix;
        return label;
      }

      function refreshElapsedLabels(root) {
        for (const label of root.querySelectorAll(".elapsed-age")) {
          label.textContent = `${age(label.dataset.time)}${label.dataset.suffix}`;
        }
      }

      function span(seconds) {
        if (seconds < 60) return `${seconds}s`;
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `${minutes}m`;
        const hours = Math.floor(minutes / 60);
        if (hours < 48) return `${hours}h ${minutes % 60}m`;
        return `${Math.floor(hours / 24)}d`;
      }

      function dueIn(due) {
        return due <= Date.now() ? "due now" : `next in ${span(Math.ceil((due - Date.now()) / 1000))}`;
      }

      // Octicons (16px): issue-opened and git-pull-request.
      const GLYPHS = {
        issues: ["Issue", ["M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z", "M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Z"]],
        pull: ["Pull request", ["M1.5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm5.677-.177L9.573.677A.25.25 0 0 1 10 .854V2.5h1A2.5 2.5 0 0 1 13.5 5v5.628a2.251 2.251 0 1 1-1.5 0V5a1 1 0 0 0-1-1h-1v1.646a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354ZM3.75 2.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm0 9.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm8.25.75a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Z"]],
      };

      function glyph(kind) {
        const [label, paths] = GLYPHS[kind];
        const node = svg("svg", { viewBox: "0 0 16 16", width: 14, height: 14, role: "img", "aria-label": label, title: label });
        node.append(...paths.map((d) => svg("path", { d })));
        return node;
      }

      function reference(href) {
        const url = githubURL(href);
        const parts = url.pathname.split("/");
        const node = link(parts.pop(), url.href);
        node.prepend(glyph(parts.pop()));
        node.className = "ref";
        node.title = url.href;
        node.target = "_blank";
        node.rel = "noopener noreferrer";
        return node;
      }

      function highlightJSON(value) {
        const pre = element("pre", null, "json");
        const source = JSON.stringify(value, null, 2);
        const token = /("(?:\\.|[^"\\])*")(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g;
        let last = 0;
        for (const match of source.matchAll(token)) {
          const [text, string, colon] = match;
          pre.append(source.slice(last, match.index));
          if (colon) pre.append(element("span", string, "json-key"), colon);
          else pre.append(element("span", text, string ? "json-string" : "json-literal"));
          last = match.index + text.length;
        }
        pre.append(source.slice(last));
        return pre;
      }

      function wireDismiss(node, closeButtonId, close) {
        document.getElementById(closeButtonId).addEventListener("click", close);
        node.addEventListener("cancel", (event) => {
          event.preventDefault();
          close();
        });
        let pressed = false;
        const outside = (event) => {
          if (event.target !== node) return false;
          const box = node.getBoundingClientRect();
          return event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom;
        };
        node.addEventListener("pointerdown", (event) => { pressed = outside(event); });
        node.addEventListener("click", (event) => {
          if (pressed && outside(event)) close();
          pressed = false;
        });
      }

      function valuesAtPath(value, path) {
        if (!path.length) return [value];
        if (Array.isArray(value)) return value.flatMap((item) => valuesAtPath(item, path));
        if (!value || typeof value !== "object") return [];
        const key = Object.keys(value).find((name) => name.toLowerCase() === path[0].toLowerCase());
        return key ? valuesAtPath(value[key], path.slice(1)) : [];
      }

      function matchesTask(task, query) {
        const terms = query.match(/(?:[^\s"]+|"[^"]*")+/g) ?? [];
        if (!terms.length) return true;
        let allFields;
        return terms.every((term) => {
          const field = /^([\w.-]+):(.+)$/u.exec(term);
          if (field && Object.keys(task).some((key) => key.toLowerCase() === field[1].split(".")[0].toLowerCase())) {
            const value = field[2].replace(/^"|"$/g, "").toLowerCase();
            return valuesAtPath(task, field[1].split(".")).some((item) =>
              JSON.stringify(item).toLowerCase().includes(value));
          }
          allFields ??= JSON.stringify(task).toLowerCase();
          return allFields.includes(term.replace(/^"|"$/g, "").toLowerCase());
        });
      }

      const filterQuery = () => document.getElementById("global-filter").value.trim();

      function filteredTasks() {
        const query = filterQuery();
        return snapshot.tasks.filter((task) => matchesTask(task, query));
      }

      function renderFilterStatus(matchingCount) {
        const status = document.getElementById("global-filter-count");
        const query = filterQuery();
        if (!snapshot || !query) {
          status.textContent = "";
          status.hidden = true;
          return;
        }
        status.textContent = `${matchingCount} of ${snapshot.tasks.length} tasks match.`;
        status.hidden = false;
      }

      function closeMove() {
        const comment = moveDialog.querySelector("textarea")?.value;
        if (comment && !window.confirm("Discard your unsaved comment?")) return;
        moveDialog.close();
      }

      function openMove(task) {
        const title = document.getElementById("move-title");
        title.replaceChildren(...codeParts(`${task.state === "blocked" ? "Unblock" : "Move"}: ${task.title}`));
        document.getElementById("move-body").replaceChildren(moveForm(task));
        moveDialog.showModal();
        moveDialog.querySelector("select").focus();
      }

      function closeSettings() {
        const form = settingsDialog.querySelector("form");
        if (form?.dirty() && !window.confirm("Discard your unsaved settings?")) return;
        settingsDialog.close();
      }

      function openSettings() {
        const form = settingsForm();
        document.getElementById("settings-body").replaceChildren(form);
        settingsDialog.showModal();
        form.querySelector("input").focus();
      }

      const paletteInput = document.getElementById("palette-input");
      const paletteList = document.getElementById("palette-list");
      let paletteMatches = [];
      let paletteActive = 0;

      function setPaletteActive(index) {
        paletteActive = index;
        [...paletteList.children].forEach((option, position) => {
          option.setAttribute("aria-selected", String(position === index));
          if (position === index) option.scrollIntoView({ block: "nearest" });
        });
        paletteInput.setAttribute("aria-activedescendant", paletteMatches.length ? `palette-option-${index}` : "");
      }

      function paletteOption(task, index) {
        const node = element("li", null, "option");
        node.id = `palette-option-${index}`;
        node.setAttribute("role", "option");
        node.dataset.taskId = task.id;
        node.style.setProperty("--c", `var(--${task.state})`);
        const heading = element("div", null, "option-title");
        heading.append(element("span", task.title), element("span", task.state, "chip state"));
        const meta = element("p", null, "option-meta muted");
        meta.append(element("code", task.id));
        for (const href of [task.issue, task.pr]) {
          if (!href) continue;
          const parts = githubURL(href).pathname.split("/");
          const number = element("span", parts.pop(), "ref");
          number.prepend(glyph(parts.pop()));
          meta.append(number);
        }
        node.append(heading, meta);
        node.addEventListener("click", () => openTask(task.id));
        return node;
      }

      function renderPalette() {
        paletteMatches = rankTasks(snapshot.tasks, paletteInput.value);
        paletteList.replaceChildren(...paletteMatches.map(paletteOption));
        const count = paletteMatches.length;
        document.getElementById("palette-status").textContent = `${count} ${count === 1 ? "task" : "tasks"}`;
        setPaletteActive(0);
      }

      function openPalette() {
        paletteInput.value = "";
        renderPalette();
        paletteDialog.showModal();
        paletteInput.focus();
      }

      function openTask(id) {
        const task = snapshot.tasks.find((item) => item.id === id);
        paletteDialog.close();
        if (!task) return;
        const outcome = task.state === "resolved" ? task.resolution.outcome : null;
        const query = filterQuery();
        if (query && !matchesTask(task, query)) document.getElementById("global-filter").value = "";
        const docked = openState() === task.state && (!openOutcome() || openOutcome() === outcome);
        setHash(docked ? location.hash : `#${task.state}${outcome ? `/${outcome}` : ""}`);
        const row = [...document.getElementById("task-list").children].find((item) => item.dataset.taskId === id);
        if (!row) return;
        row.setAttribute("tabindex", "-1");
        row.classList.add("task-flash");
        row.addEventListener("blur", () => row.classList.remove("task-flash"), { once: true });
        row.focus({ preventScroll: true });
        row.scrollIntoView({ block: "center", behavior: reduced ? "auto" : "smooth" });
      }

      function onPaletteKey(event) {
        const last = paletteMatches.length - 1;
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          if (last < 0) return;
          const step = event.key === "ArrowDown" ? 1 : -1;
          setPaletteActive((paletteActive + step + last + 1) % (last + 1));
        } else if (event.key === "Enter" && last >= 0) {
          event.preventDefault();
          openTask(paletteMatches[paletteActive].id);
        }
      }

      // Fall back to the physical key only when `key` is not a Latin letter (for example "Dead"),
      // so Dvorak and other Latin layouts keep their own Cmd+letter shortcuts.
      function isKKey(event) {
        const key = String(event.key ?? "");
        return key.toLowerCase() === "k" || (event.code === "KeyK" && !/^[a-z]$/i.test(key));
      }

      function onGlobalKey(event) {
        const popupOpen = moveDialog.open || settingsDialog.open;
        if ((event.metaKey || event.ctrlKey) && isKKey(event)) {
          if (event.repeat) {
            event.preventDefault();
          } else if (paletteDialog.open) {
            event.preventDefault();
            paletteDialog.close();
          } else if (snapshot && !popupOpen) {
            event.preventDefault();
            openPalette();
          }
          return;
        }
        if (popupOpen || paletteDialog.open) return;
        if (event.key === "Escape" && !panel.hidden) closeChoice();
        if (event.key === "/" && !event.metaKey && !event.ctrlKey && !event.altKey
          && !event.target.closest("input, textarea, select, [contenteditable]")) {
          event.preventDefault();
          document.getElementById("global-filter").focus();
        }
        if (event.defaultPrevented || event.repeat || event.target.closest("input, textarea, select, [contenteditable]")) return;
        const index = digitIndex(event, sidebar.length);
        if (index >= 0) {
          event.preventDefault();
          select(sidebar[index]);
        }
      }

      // One section per stored object. Each field is saved only when its value changed.
      const settingFields = [
        { section: "budget", label: "Total workers running at the same time", blank: "No total cap", min: 1, max: maxParallelWorkers },
        { section: "limits", key: "investigation", label: "Investigation workers", min: 1, max: maxRoleLimit },
        { section: "limits", key: "implementation", label: "Implementation workers", min: 1, max: maxRoleLimit },
        { section: "lever", key: "spend", label: "Spend ceiling", choices: leverSpends },
        { section: "lever", key: "autonomy_cap", label: "Autonomy ceiling", choices: leverAutonomyCaps },
      ];
      const settingHeadings = {
        budget: ["Workers", "The factory reads these on its next pass and never starts a worker past them. Lowering them does not stop running workers."],
        lever: ["Lever", "Ceilings only: they lower what Lever resolves and never raise it. They grant nothing."],
      };

      function seenSettings(data) {
        return {
          budget: data.budget?.max_parallel_workers ?? null,
          limits: { investigation: data.limits.investigation ?? null, implementation: data.limits.implementation ?? null },
          lever: { spend: data.lever?.spend ?? null, autonomy_cap: data.lever?.autonomy_cap ?? null },
        };
      }

      const settingValue = (seen, field) => (field.key ? seen[field.section][field.key] : seen[field.section]);

      function leverNow(data) {
        const recorded = data.tasks.filter((task) => task.details?.lever?.effective_level)
          .sort((a, b) => Date.parse(b.updated_at) - Date.parse(a.updated_at))[0];
        return recorded
          ? `Latest recorded autonomy: ${recorded.details.lever.effective_level} (${recorded.id}). Read-only.`
          : "No task records an autonomy level yet.";
      }

      function settingsForm() {
        const file = selection;
        let expected = seenSettings(snapshot);
        const form = element("form", null, "settings-form move-form");
        const fields = element("fieldset");
        const controls = new Map();
        const initial = new Map();
        for (const field of settingFields) {
          if (settingHeadings[field.section] && (field.section === "budget" || field.key === "spend")) {
            const [title, note] = settingHeadings[field.section];
            fields.append(element("h3", title), element("p", note, "muted"));
            if (field.section === "lever") fields.append(element("p", leverNow(snapshot), "muted"));
          }
          const label = element("label", field.label);
          const control = element(field.choices ? "select" : "input");
          control.name = field.key ?? field.section;
          if (field.choices) {
            control.append(...["", ...field.choices].map((value) => {
              const option = element("option", value || "No cap");
              option.value = value;
              return option;
            }));
          } else {
            control.type = "number";
            control.min = String(field.min);
            control.max = String(field.max);
            control.step = "1";
            if (field.blank) control.placeholder = field.blank;
          }
          control.value = String(settingValue(expected, field) ?? "");
          controls.set(field, control);
          initial.set(field, control.value);
          label.append(control);
          fields.append(label);
        }
        const error = element("p", null, "save-error");
        error.setAttribute("role", "alert");
        error.hidden = true;
        const status = element("p", null, "muted");
        status.setAttribute("role", "status");
        const reload = element("button", "Reload settings");
        reload.type = "button";
        reload.hidden = true;
        const save = element("button", "Save settings", "action-primary");
        save.type = "submit";
        const actions = element("div", null, "controls");
        actions.append(reload, save);
        fields.append(status, error, actions);
        form.append(fields);
        const changed = () => settingFields.filter((field) => controls.get(field).value !== initial.get(field));
        form.dirty = () => changed().length > 0;
        const failed = (cause, canReload = true) => {
          error.textContent = cause.message;
          error.hidden = false;
          reload.hidden = !canReload;
        };
        reload.addEventListener("click", async () => {
          fields.disabled = true;
          try {
            const data = await requestJSON(`/api/factory?${new URLSearchParams({ file })}`);
            validate(data);
            expected = seenSettings(data);
            for (const field of settingFields) {
              const control = controls.get(field);
              const value = String(settingValue(expected, field) ?? "");
              if (control.value === initial.get(field)) control.value = value;
              initial.set(field, value);
            }
            status.textContent = "Reloaded. Your edits are kept. Check them before saving again.";
            error.hidden = true;
            reload.hidden = true;
            if (selection === file) load(data, file);
          } catch (cause) {
            failed(cause);
          } finally {
            fields.disabled = false;
          }
        });
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          if (fields.disabled) return;
          const set = {};
          const saw = {};
          for (const field of changed()) {
            const raw = controls.get(field).value;
            let value = raw || null;
            if (!field.choices) {
              value = raw === "" ? null : Number(raw);
              if (!Number.isInteger(value) || value < field.min || value > field.max) {
                return failed(new Error(`${field.label} must be a whole number from ${field.min} to ${field.max}.`), false);
              }
            }
            if (field.key) {
              (set[field.section] ??= {})[field.key] = value;
              (saw[field.section] ??= {})[field.key] = expected[field.section][field.key];
            } else {
              set[field.section] = value;
              saw[field.section] = expected[field.section];
            }
          }
          if (!Object.keys(set).length) {
            settingsDialog.close();
            return;
          }
          fields.disabled = true;
          error.hidden = true;
          mutation += 1;
          try {
            const data = await requestJSON(`/api/settings?${new URLSearchParams({ file })}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ set, expected: saw }),
            });
            validate(data);
            if (settingsDialog.querySelector("form") === form) settingsDialog.close();
            if (selection === file) load(data, file);
          } catch (cause) {
            failed(new Error(`Settings were not saved: ${cause.message}`));
          } finally {
            mutation += 1;
            fields.disabled = false;
          }
        });
        return form;
      }

      function blockContext(task) {
        const { from, reason, since } = task.blocker;
        const heading = element("p", `Blocked in ${from} for `, "muted");
        heading.append(elapsedLabel(since));
        const body = rich("p", reason, "unblock-reason");
        body.tabIndex = 0;
        body.setAttribute("role", "region");
        body.setAttribute("aria-label", "Blocker reason");
        const nodes = [heading, body];
        const notes = task.history.filter((item) => item.note && item.note !== reason).slice(-3).reverse();
        if (notes.length) {
          const list = element("ul", null, "unblock-notes");
          list.append(...notes.map((item) => rich("li", `${item.state} ${shortTime(item.at)}: ${item.note}`)));
          nodes.push(list);
        }
        return nodes;
      }

      function moveForm(task) {
        const file = selection;
        let current = task;
        const form = element("form", null, "move-form");
        const fields = element("fieldset");
        const unblock = task.state === "blocked";
        const context = element("section", null, "unblock-context");
        context.setAttribute("aria-label", "Why this task is blocked");
        const stateLabel = element("label", "Move to");
        const state = element("select");
        state.name = "state";
        state.autofocus = true;
        const resolutionLabel = element("label", "Resolution outcome");
        const resolution = element("select");
        resolution.name = "resolution";
        resolution.required = true;
        for (const value of operatorOutcomes) {
          const option = element("option", outcomeTitles[value]);
          option.value = value;
          resolution.append(option);
        }
        resolution.value = "completed";
        resolutionLabel.append(resolution);
        const showResolution = () => {
          resolutionLabel.hidden = state.value !== "resolved";
          resolution.disabled = resolutionLabel.hidden;
        };
        state.addEventListener("change", showResolution);
        const setChoices = () => {
          const previous = state.value;
          const choices = operatorStates(current);
          state.replaceChildren(...choices.map((value) => {
            const option = element("option", places[value].title);
            option.value = value;
            return option;
          }));
          if (choices.includes(previous)) state.value = previous;
          else if (unblock && choices.length) state.value = unblockState(current);
          showResolution();
          renderOptions();
        };
        const options = element("div", null, "unblock-options");
        options.setAttribute("role", "group");
        options.setAttribute("aria-label", "Suggested answers");
        const renderOptions = () => {
          const blocked = unblock && current.state === "blocked" && current.blocker;
          context.hidden = !blocked;
          context.replaceChildren(...(blocked ? blockContext(current) : []));
          const suggested = blocked ? current.blocker.options ?? [] : [];
          options.hidden = !suggested.length;
          options.replaceChildren(...(suggested.length ? [element("p", "Suggested answers. Pick one, then edit or write your own below.", "muted")] : []),
            ...suggested.map((option) => {
              const choice = rich("button", stripRecommended(option.label), "option");
              choice.type = "button";
              choice.setAttribute("aria-pressed", "false");
              if (option.recommended) choice.append(element("span", "Recommended", "tag"));
              choice.addEventListener("click", () => {
                const picked = unblockChoice(current, option);
                if (operatorStates(current).includes(picked.state)) state.value = picked.state;
                comment.value = picked.comment;
                showResolution();
                for (const other of options.querySelectorAll("button")) other.setAttribute("aria-pressed", String(other === choice));
                comment.focus();
              });
              return choice;
            }));
        };
        const comment = element("textarea");
        setChoices();
        stateLabel.append(state);
        const commentLabel = element("label", "Comment for the factory");
        comment.name = "comment";
        comment.required = true;
        comment.maxLength = 4000;
        comment.rows = 3;
        comment.placeholder = "For example: This is now unblocked.";
        commentLabel.append(comment);
        const notice = element("p",
          "The factory must read the saved comment and reconcile workers. This does not stop running workers or merge a PR.",
          "muted");
        const error = element("p", null, "save-error");
        error.setAttribute("role", "alert");
        error.hidden = true;
        const save = element("button", "Save move", "action-primary");
        save.type = "submit";
        save.title = "Save move (⌘/Ctrl+Enter)";
        const reload = element("button", "Reload task");
        reload.type = "button";
        reload.hidden = true;
        const actions = element("div", null, "controls");
        actions.append(reload, save);
        fields.append(...(unblock ? [context] : []), stateLabel, resolutionLabel, options, commentLabel, notice, error, actions);
        form.append(fields);
        const failed = (cause) => {
          error.textContent = cause.message;
          error.hidden = false;
          reload.hidden = false;
        };
        reload.addEventListener("click", async () => {
          fields.disabled = true;
          try {
            const data = await requestJSON(`/api/factory?${new URLSearchParams({ file })}`);
            validate(data);
            const latest = data.tasks.find((item) => item.id === task.id);
            if (!latest) {
              save.disabled = true;
              throw new Error("This task no longer exists. Your comment has not been discarded.");
            }
            current = latest;
            setChoices();
            save.disabled = !state.options.length;
            notice.textContent = `Current state: ${places[current.state].title}. Your comment is kept. Review the destination before saving again.`;
            error.hidden = true;
            if (selection === file) load(data, file);
          } catch (cause) {
            failed(cause);
          } finally {
            fields.disabled = false;
          }
        });
        form.addEventListener("keydown", (event) => {
          if (event.key !== "Enter" || !(event.metaKey || event.ctrlKey)) return;
          event.preventDefault();
          if (!save.disabled) form.requestSubmit();
        });
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          if (fields.disabled) return;
          fields.disabled = true;
          error.hidden = true;
          mutation += 1;
          try {
            const destination = state.value;
            const data = await requestJSON(`/api/move?${new URLSearchParams({ file })}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                task: task.id, state: destination, comment: comment.value, revision: current.revision ?? 0,
                ...(destination === "resolved" ? { resolution: resolution.value } : {}),
              }),
            });
            validate(data);
            const ownsDialog = moveDialog.querySelector("form") === form;
            if (ownsDialog) moveDialog.close();
            if (selection === file) {
              load(data, file);
              if (ownsDialog) panel.focus();
            }
          } catch (cause) {
            failed(new Error(`Move was not confirmed: ${cause.message} Reload the task before trying again.`));
          } finally {
            mutation += 1;
            fields.disabled = false;
          }
        });
        return form;
      }

      function appendArtifacts(parent, worker) {
        for (const field of ["brief", "result"]) {
          if (!worker[field]) continue;
          const query = new URLSearchParams({ file: selection, name: artifactName(worker[field], field) });
          parent.append(link(field, `/api/artifact?${query}`), " ");
        }
      }

      function shortTime(at) {
        const time = new Date(at);
        return Number.isNaN(time.getTime()) ? at
          : time.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
      }

      function historySteps(history) {
        return history.map((item, index) => {
          const previous = history[index - 1];
          const seconds = previous ? Math.round((Date.parse(item.at) - Date.parse(previous.at)) / 1000) : NaN;
          return {
            state: item.state,
            at: item.at,
            time: shortTime(item.at),
            note: item.note ?? null,
            operator: item.source === "dashboard",
            gap: Number.isFinite(seconds) ? `+${span(Math.max(0, seconds))}` : null,
            back: previous?.state === "review" && item.state === "implementation" ? "rework"
              : previous?.state === "blocked" ? "unblocked" : null,
          };
        });
      }

      function historyItem(step, index) {
        const entry = element("li");
        if (index > 0) {
          const gap = element("div", null, "history-gap");
          if (step.gap) gap.append(element("span", step.gap));
          if (step.back) gap.append(element("span", `↩ ${step.back}`));
          entry.append(gap);
        }
        const box = element("div", null, `history-node${step.operator ? " operator" : ""}`);
        box.style.setProperty("--c", `var(--${step.state})`);
        box.title = [`${step.state} at ${step.at}`, step.operator ? "operator move from the dashboard" : null, step.note]
          .filter(Boolean).join("\n");
        const head = element("div");
        head.append(element("span", step.state, "history-state"), " ", element("span", step.time, "history-time"));
        if (step.operator) head.append(element("span", "operator", "history-badge"));
        box.append(head);
        if (step.note) box.append(rich("p", step.note, "history-note"));
        entry.append(box);
        return entry;
      }

      // Long histories fold the older steps into a details element; every step stays in the DOM.
      const HISTORY_RECENT = 8;
      function historyFlow(task, expanded) {
        const steps = historySteps(task.history);
        const earlier = Math.max(0, steps.length - HISTORY_RECENT);
        const list = (from, to) => {
          const items = element("ol", null, "history");
          items.setAttribute("role", "list");
          items.start = from + 1;
          items.append(...steps.slice(from, to).map((step, index) => historyItem(step, from + index)));
          return items;
        };
        if (!earlier) return [list(0, steps.length)];
        const folded = element("details", null, "history-earlier");
        folded.dataset.taskId = `${task.id}:history`;
        folded.open = expanded.has(folded.dataset.taskId);
        folded.append(element("summary", `Earlier steps (${earlier})`), list(0, earlier));
        return [folded, list(earlier, steps.length)];
      }

      function taskRow(task, expanded) {
        const node = element("li", null, "task-row");
        node.dataset.taskId = task.id;
        node.style.setProperty("--c", `var(--${task.state})`);
        const cycles = cyclesOf(task);
        const heading = element("div", null, "row-head");
        heading.append(rich("h3", task.title));
        if (operatorStates(task).length) {
          const move = element("button", task.state === "blocked" ? "Unblock" : "Move", "move");
          move.type = "button";
          move.addEventListener("click", () => openMove(task));
          heading.append(move);
        }
        node.append(heading);
        const references = new Set([...(task.issue ? [task.issue] : []), ...(task.pr ? [task.pr] : []), ...task.links]);
        if (references.size) {
          const links = element("p", null, "links");
          for (const href of sortReferences(references)) links.append(reference(href));
          node.append(links);
        }
        const chips = element("p", null, "chips");
        const stateAge = element("span", `${task.state} for `, "chip state");
        stateAge.append(elapsedLabel(entered(task)));
        chips.append(stateAge);
        if (cycles) chips.append(element("span", `${cycles} review ${cycles === 1 ? "cycle" : "cycles"}`, "chip"));
        for (const [label, sha] of [["head", task.head], ["reviewed", task.reviewed_head]]) {
          if (!sha) continue;
          const chip = element("span", `${label} `, "chip");
          chip.append(element("code", sha.slice(0, 7)));
          chips.append(chip);
        }
        node.append(chips);
        if (task.blocker) {
          node.append(rich("p", `Blocked in ${task.blocker.from}: ${task.blocker.reason}`));
          if (task.blocker.options) {
            const choices = element("ul", null, "blocker-options");
            for (const option of task.blocker.options) {
              choices.append(rich("li", `${stripRecommended(option.label)}${option.recommended ? " (recommended)" : ""}`));
            }
            node.append(choices);
          }
        }
        if (task.resolution) {
          node.append(rich("p", `Resolved: ${task.resolution.outcome}${task.resolution.note ? `. ${task.resolution.note}` : ""}`));
        }
        if (task.feedback) {
          const feedback = task.history.find((item) => item.feedback_id === task.feedback.id);
          node.append(rich("p", feedback.note, "feedback-note"),
            element("p", task.feedback.acknowledged_id === task.feedback.id
              ? "Factory acknowledged this direction." : "Awaiting factory acknowledgement.", "muted"));
        }
        node.append(element("h4", `History (${task.history.length})`), ...historyFlow(task, expanded));
        const more = element("details");
        more.dataset.taskId = `${task.id}:details`;
        more.open = expanded.has(more.dataset.taskId);
        const identity = element("p", null, "muted");
        identity.append(element("code", snapshot.project), " / ", element("code", task.id));
        more.append(element("summary", "Task details"), identity);
        if (task.pr && task.state !== "resolved") {
          const merge = element("p");
          if (task.merge) {
            merge.append(`Merge decision recorded for ${task.merge.authorized_by} (${task.merge.source}) `,
              elapsedLabel(task.merge.authorized_at, " ago"),
              task.merge.requested_at ? "; landing requested" : "");
          } else {
            merge.textContent = "Merge: no current-head decision recorded";
          }
          more.append(merge);
        }

        const workers = Object.entries(task.workers).filter(([, worker]) => worker);
        if (workers.length) {
          const list = element("ul", null, "workers");
          for (const [role, worker] of workers) {
            const item = element("li");
            const dot = element("span", null, `dot ${worker.status}`);
            item.append(dot, ...codeParts(`${role}: ${worker.status}${worker.name ? `, ${worker.name}` : ""}${worker.pane ? `, ${worker.pane}` : ""} `));
            appendArtifacts(item, worker);
            list.append(item);
          }
          more.append(list);
        }
        if (task.worktree) {
          const worktree = element("p", "Worktree: ", "muted");
          worktree.append(element("code", task.worktree.path));
          more.append(worktree);
        }

        if (task.details && Object.keys(task.details).length) {
          const details = element("details");
          details.dataset.taskId = task.id;
          // The highlighted JSON is large; build it only once the section is opened.
          const showJSON = () => {
            if (details.open && !details.querySelector("pre")) details.append(highlightJSON(task.details));
          };
          details.addEventListener("toggle", showJSON);
          details.open = expanded.has(task.id);
          details.append(element("summary", "Evidence and task details"));
          showJSON();
          more.append(details);
        }
        node.append(more);
        return node;
      }

      function renderDetail(state, matchingTasks) {
        const list = document.getElementById("task-list");
        const finder = !state && producersOpen();
        document.getElementById("task-view").hidden = finder;
        document.getElementById("producers-view").hidden = !finder;
        if (!state) {
          moveDialog.close();
          panel.dataset.state = "";
          panel.dataset.outcome = "";
          list.replaceChildren();
          list.dataset.signature = "";
          if (finder) {
            renderProducers();
            showPanel();
          } else {
            panel.hidden = true;
          }
          return;
        }
        setCloseLabel("Close task list");
        const outcome = openOutcome();
        const sameList = panel.dataset.state === state && panel.dataset.outcome === (outcome ?? "");
        const filter = filterQuery();
        const sameFilter = list.dataset.filter === filter;
        const expanded = new Set([...list.querySelectorAll("details[open]")].map((node) => node.dataset.taskId));
        const inList = (task) => task.state === state && (!outcome || task.resolution.outcome === outcome);
        const allTasks = snapshot.tasks.filter(inList);
        const tasks = byRecency(matchingTasks.filter(inList));
        const title = document.getElementById("detail-title");
        title.textContent = outcome ? `Resolved: ${outcomeTitles[outcome]}` : places[state].title;
        title.append(element("span", String(tasks.length), "counter"));
        const filterCount = document.getElementById("detail-filter-count");
        filterCount.hidden = !filter;
        filterCount.textContent = filter
          ? `${tasks.length} of ${allTasks.length} tasks match the global filter.`
          : "";
        const signature = JSON.stringify([selection, state, outcome, filter,
          tasks.map((task) => [task.id, task.revision, task.updated_at, task.history.length])]);
        if (list.dataset.signature !== signature) {
          const rows = tasks.map((task) => taskRow(task, expanded));
          if (!reduced && sameList && sameFilter) {
            [...list.children].forEach((row, index) => {
              if (tasks.some((task) => task.id === row.dataset.taskId)) return;
              rows.splice(index, 0, row);
              if (row.inert) return;
              row.inert = true;
              row.animate({ opacity: [1, 0] }, {
                duration: 300, easing: "ease-out", fill: "forwards",
              }).onfinish = () => {
                row.remove();
                document.getElementById("detail-empty").hidden = list.children.length > 0;
              };
            });
          }
          list.replaceChildren(...rows);
          list.dataset.signature = signature;
          list.dataset.filter = filter;
        }
        refreshElapsedLabels(list);
        document.getElementById("detail-empty").hidden = list.children.length > 0;
        let emptyMessage = "No tasks in this state.";
        if (outcome) emptyMessage = "No tasks with this outcome.";
        if (filter) emptyMessage = "No tasks match this filter.";
        document.getElementById("detail-empty").textContent = emptyMessage;
        panel.dataset.state = state;
        panel.dataset.outcome = outcome ?? "";
        showPanel();
      }

      function showPanel() {
        if (!panel.hidden) return;
        panel.hidden = false;
        panel.focus();
      }

      function setCloseLabel(label) {
        const button = document.getElementById("close-detail");
        button.setAttribute("aria-label", label);
        button.title = label;
      }

      function ruleRow(rule) {
        const node = element("li", null, "task-row");
        node.dataset.ruleId = rule.id;
        const heading = element("div", null, "row-head");
        const chips = element("span", null, "chips");
        chips.append(element("span", rule.kind ?? "rule", "chip"),
          element("span", rule.enabled ? "enabled" : "disabled", "chip"));
        heading.append(element("h3", rule.id), chips);
        node.append(heading, rich("p", rule.description));
        if (rule.query) {
          const query = element("p", "Search: ");
          query.append(element("code", rule.query));
          node.append(query);
        }
        if (rule.prompt) node.append(rich("p", `Prompt: ${rule.prompt}`));
        const due = nextRun(rule);
        const when = !rule.every ? "No schedule: runs on start or when asked."
          : [`Every ${rule.every}`, rule.last_run_at ? `last run ${age(rule.last_run_at)} ago` : "never run",
            ...(due === null ? ["disabled"] : [dueIn(due)])].join(", ");
        node.append(element("p", when, "muted"));
        if (rule.worker) {
          const item = element("p");
          const worker = rule.worker;
          item.append(element("span", null, `dot ${worker.status}`),
            `Worker: ${[worker.status, worker.mode].filter(Boolean).join(", ")} `);
          appendArtifacts(item, worker);
          node.append(item);
        }
        return node;
      }

      function renderProducers() {
        document.getElementById("detail-title").textContent = "Find work";
        setCloseLabel("Close find work");
        const manual = element("li", null, "task-row");
        manual.append(element("h3", "User links"),
          element("p", "Send an issue or PR link to the factory session. Links you send do not use the rules or the skipped list.", "muted"));
        document.getElementById("rule-list").replaceChildren(...snapshot.rules.filter(isFinder).map(ruleRow), manual);
        const improve = snapshot.rules.filter((rule) => !isFinder(rule));
        document.getElementById("improve-list").replaceChildren(...improve.map(ruleRow));
