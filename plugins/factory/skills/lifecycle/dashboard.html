<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Factory</title>
    <style>
      /* GitHub Primer tokens, inlined so the loopback page needs no network. */
      :root {
        color-scheme: light dark;
        --fg: #1f2328;
        --fg-muted: #59636e;
        --bg: #ffffff;
        --bg-muted: #f6f8fa;
        --border: #d1d9e0;
        --border-emphasis: #818b98;
        --btn-bg: #f6f8fa;
        --btn-hover: #eff2f5;
        --accent: #0969da;
        --success: #1a7f37;
        --attention: #9a6700;
        --danger: #d1242f;
        --done: #8250df;
        --neutral: #59636e;
        --initial: var(--neutral);
        --investigation: var(--accent);
        --implementation: var(--success);
        --review: var(--attention);
        --blocked: var(--danger);
        --resolved: var(--done);
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif,
          "Apple Color Emoji", "Segoe UI Emoji";
        font-size: 14px;
        line-height: 1.5;
        color: var(--fg);
        background: var(--bg);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f0f6fc;
          --fg-muted: #9198a1;
          --bg: #0d1117;
          --bg-muted: #151b23;
          --border: #3d444d;
          --border-emphasis: #656c76;
          --btn-bg: #212830;
          --btn-hover: #262c36;
          --accent: #4493f8;
          --success: #3fb950;
          --attention: #d29922;
          --danger: #f85149;
          --done: #ab7df8;
          --neutral: #9198a1;
        }
      }
      * { box-sizing: border-box; }
      body { max-width: 1280px; margin: 0 auto; padding: 24px 32px; }
      header { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
      h1 { margin: 0 0 8px; font-size: 24px; font-weight: 600; }
      h2 { margin: 0; font-size: 20px; font-weight: 400; }
      h3 { margin: 0; font-size: 16px; font-weight: 600; }
      p { margin: 8px 0; }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      label { display: block; margin-bottom: 4px; font-weight: 600; }
      code, pre { font-family: var(--mono); font-size: 12px; }
      button, select { font: inherit; line-height: 20px; color: var(--fg); border: 1px solid var(--border); border-radius: 6px; }
      button { padding: 5px 16px; font-weight: 500; background: var(--btn-bg); cursor: pointer; }
      button:hover { background: var(--btn-hover); }
      select { width: 480px; max-width: 100%; padding: 5px 12px; background: var(--bg); }
      .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
      .muted { color: var(--fg-muted); }
      a:focus-visible, button:focus-visible, select:focus-visible, summary:focus-visible,
      .node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .node:focus-visible { outline-offset: 4px; }
      #error, #discovery-error, .blocker { padding: 16px; border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent);
        border-radius: 6px; background: color-mix(in srgb, var(--danger) 10%, var(--bg)); }

      #flow { width: 100%; height: auto; max-height: 70vh; display: block; }
      .edge { fill: none; stroke: var(--border-emphasis); stroke-width: 2; stroke-dasharray: 8 6;
        animation: flow 1s linear infinite; transition: opacity .4s; }
      .edge.idle { opacity: .35; }
      .edge.dashed { stroke: var(--blocked); opacity: .6; }
      .edge.dashed.idle { opacity: .25; }
      .edge.shortcut { stroke: var(--resolved); opacity: .6; }
      .edge.shortcut.idle { opacity: .25; }
      .arrow { fill: var(--border-emphasis); }
      .label { fill: var(--fg-muted); font-size: 12px; text-anchor: middle; }
      @keyframes flow { to { stroke-dashoffset: -28; } }

      .node { cursor: pointer; }
      .node .box { fill: color-mix(in srgb, var(--c) 8%, var(--bg)); stroke: color-mix(in srgb, var(--c) 45%, var(--border));
        stroke-width: 1; transition: stroke-width .2s, fill .2s; }
      .node:hover .box { fill: color-mix(in srgb, var(--c) 14%, var(--bg)); }
      .node.selected .box { stroke: var(--c); stroke-width: 2; fill: color-mix(in srgb, var(--c) 14%, var(--bg)); }
      .node .name { fill: var(--c); font-size: 14px; font-weight: 600; text-anchor: middle; }
      .node .count { fill: var(--fg); font-size: 40px; font-weight: 600; text-anchor: middle; }
      .node .sub { fill: var(--fg-muted); font-size: 12px; text-anchor: middle; }
      .ring { fill: none; stroke: var(--c); stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; }
      .active .ring { animation: ring 2s ease-out infinite; }
      .node.bump { animation: bump .6s ease-out; transform-box: fill-box; transform-origin: center; }
      .pop { animation: pop .6s cubic-bezier(.2, 1.4, .4, 1) both; animation-delay: calc(var(--i, 0) * 90ms);
        transform-box: fill-box; transform-origin: center; }
      @keyframes ring { 0% { opacity: .8; transform: scale(1); } 100% { opacity: 0; transform: scale(1.18); } }
      @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.08); } 100% { transform: scale(1); } }
      @keyframes pop { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
      .token { stroke: var(--bg); stroke-width: 2; }
      @media (prefers-reduced-motion: reduce) {
        .edge, .active .ring, .node.bump, .pop { animation: none; }
        .ring { display: none; }
      }

      #detail { margin-top: 24px; }
      .detail-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;
        padding-bottom: 8px; border-bottom: 1px solid var(--border); }
      .counter { display: inline-block; min-width: 20px; margin-left: 8px; padding: 0 6px; border-radius: 2em;
        background: color-mix(in srgb, var(--neutral) 20%, transparent); font-size: 12px; font-weight: 500;
        line-height: 18px; text-align: center; vertical-align: middle; }
      .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; margin-top: 16px; }
      .card { padding: 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; overflow-wrap: anywhere; }
      .chips, .links { display: flex; flex-wrap: wrap; gap: 4px 8px; }
      .chip { padding: 0 7px; border: 1px solid var(--border); border-radius: 2em; color: var(--fg-muted);
        font-size: 12px; font-weight: 500; line-height: 18px; }
      .chip.state { color: var(--c); border-color: var(--c); }
      .blocker { padding: 8px 16px; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--neutral); }
      .dot.running { background: var(--success); }
      .dot.unknown { background: var(--attention); }
      ul.workers, ol.history { margin: 8px 0; padding-left: 20px; }
      summary { cursor: pointer; color: var(--fg-muted); }
      pre { padding: 16px; border-radius: 6px; background: var(--bg-muted); white-space: pre-wrap; }
      @media (max-width: 600px) { body { padding: 16px; } .cards { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <h1 id="goal">Factory</h1>
      <label for="factory">Factory</label>
      <div class="controls">
        <select id="factory"><option value="">Choose a factory...</option></select>
        <button id="refresh" type="button">Refresh now</button>
      </div>
      <p id="run-state" class="muted">Choose a factory to display its flow.</p>
      <p id="freshness" class="muted"></p>
      <p id="discovery-error" role="alert" hidden></p>
      <details id="skipped" hidden>
        <summary>Some factories could not be listed</summary>
        <ul id="skipped-files"></ul>
      </details>
      <p id="error" role="alert" hidden></p>
    </header>
    <main>
      <svg id="flow" viewBox="0 0 1160 560" role="group" aria-label="Factory flow: tasks per state"></svg>
      <section id="detail" aria-live="polite" hidden></section>
    </main>
    <noscript>Enable JavaScript to read the factory.</noscript>
    <script type="module">
      import { states, artifactName, githubURL, validate, countByState, hopsSince, entered, cyclesOf } from "./factory-data.mjs";

      const SVG = "http://www.w3.org/2000/svg";
      const NODE = { w: 160, h: 110 };
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const places = {
        initial: { x: 20, y: 170, title: "Initial" },
        investigation: { x: 230, y: 170, title: "Investigation" },
        implementation: { x: 440, y: 170, title: "Implementation" },
        review: { x: 690, y: 170, title: "Review" },
        resolved: { x: 980, y: 170, title: "Resolved" },
        blocked: { x: 565, y: 410, title: "Blocked" },
      };
      const centre = (state) => ({ x: places[state].x + NODE.w / 2, y: places[state].y + NODE.h / 2 });
      const SHORTCUT = "M310,170 C310,40 1060,40 1060,170";
      const blockedSlots = { initial: 595, investigation: 625, implementation: 665, review: 695 };
      const flowRoutes = {
        "initial>investigation": "M180,225 L230,225",
        "investigation>implementation": "M390,225 L440,225",
        "implementation>review": "M600,200 L690,200",
        "review>implementation": "M690,250 L600,250",
        "review>resolved": "M850,225 L980,225",
      };
      const blockedRoute = (state) => {
        const from = centre(state);
        return `M${from.x},280 C${from.x},350 ${blockedSlots[state]},340 ${blockedSlots[state]},410`;
      };
      for (const state of Object.keys(blockedSlots)) {
        flowRoutes[`${state}>blocked`] = blockedRoute(state);
      }

      let selection = new URLSearchParams(location.search).get("file") ?? "";
      let snapshot = null;
      let lastSource = null;
      let lastRead = null;
      let cutoff = null;
      let refreshTimer = null;
      let refreshing = false;
      let pendingRefresh = false;
      let listedChoices = "";
      const shown = Object.fromEntries(states.map((state) => [state, 0]));
      const targets = Object.fromEntries(states.map((state) => [state, 0]));
      const queue = [];
      let flying = false;
      let tweening = false;

      const flow = document.getElementById("flow");

      function element(tag, value, className) {
        const node = document.createElement(tag);
        if (value != null) node.textContent = value;
        if (className) node.className = className;
        return node;
      }

      function link(label, href) {
        const node = element("a", label);
        node.href = href;
        return node;
      }

      function svg(tag, attributes = {}, text) {
        const node = document.createElementNS(SVG, tag);
        for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value);
        if (text != null) node.textContent = text;
        return node;
      }

      function openState() {
        const state = location.hash.slice(1);
        return states.includes(state) ? state : null;
      }

      function choose(state) {
        const next = openState() === state ? "" : `#${state}`;
        history.replaceState(null, "", `${location.pathname}${location.search}${next}`);
        draw();
      }

      function buildFlow() {
        const defs = svg("defs");
        const marker = svg("marker", { id: "arrow", markerWidth: 8, markerHeight: 8, refX: 7, refY: 4, orient: "auto-start-reverse" });
        marker.append(svg("path", { d: "M0,0 L8,4 L0,8z", class: "arrow" }));
        defs.append(marker);

        const edges = svg("g", { id: "edges" });
        const edge = (key, path, className = "") => {
          const node = svg("path", { d: path, class: `edge ${className}`, "marker-end": "url(#arrow)" });
          node.dataset.edge = key;
          edges.append(node);
          return node;
        };
        edge("initial>investigation", flowRoutes["initial>investigation"]);
        edge("investigation>implementation", flowRoutes["investigation>implementation"]);
        edge("implementation>review", flowRoutes["implementation>review"]);
        edge("review>implementation", flowRoutes["review>implementation"]);
        edge("review>resolved", flowRoutes["review>resolved"]);
        edge("shortcut", SHORTCUT, "shortcut");
        for (const state of Object.keys(blockedSlots)) {
          const node = edge(`${state}>blocked`, flowRoutes[`${state}>blocked`], "dashed");
          node.setAttribute("marker-start", "url(#arrow)");
        }
        const labels = svg("g");
        for (const [x, y, text] of [
          [645, 188, "PR ready"], [645, 272, "changes"], [685, 62, "already fixed, duplicate, or invalid"],
        ]) {
          labels.append(svg("text", { x, y, class: "label" }, text));
        }

        const nodes = svg("g", { id: "nodes" });
        states.forEach((state, index) => {
          const place = places[state];
          const group = svg("g", {
            class: "node pop", tabindex: 0, role: "button", style: `--c: var(--${state}); --i: ${index}`,
          });
          group.dataset.state = state;
          group.append(
            svg("rect", { class: "ring", x: place.x, y: place.y, width: NODE.w, height: NODE.h, rx: 6 }),
            svg("rect", { class: "box", x: place.x, y: place.y, width: NODE.w, height: NODE.h, rx: 6 }),
            svg("text", { class: "name", x: place.x + NODE.w / 2, y: place.y + 28 }, place.title),
            svg("text", { class: "count", x: place.x + NODE.w / 2, y: place.y + 76 }, "0"),
            svg("text", { class: "sub", x: place.x + NODE.w / 2, y: place.y + 98 }, ""),
          );
          group.addEventListener("click", () => choose(state));
          group.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              choose(state);
            }
          });
          nodes.append(group);
        });

        flow.replaceChildren(defs, edges, labels, nodes, svg("g", { id: "tokens" }));
      }

      function nodeOf(state) {
        return flow.querySelector(`.node[data-state="${state}"]`);
      }

      function draw() {
        if (!snapshot) return;
        const chosen = openState();
        for (const state of states) {
          const group = nodeOf(state);
          group.classList.toggle("selected", chosen === state);
          const tasks = snapshot.tasks.filter((task) => task.state === state);
          const running = tasks.reduce((sum, task) => sum + Object.values(task.workers)
            .filter((worker) => worker?.status === "running").length, 0);
          const live = state === "blocked" ? tasks.length > 0 : running > 0;
          group.classList.toggle("active", live);
          const idle = { initial: "queued", blocked: "needs a decision", resolved: "done" }[state] ?? "waiting";
          group.querySelector(".sub").textContent = running
            ? `${running} ${running === 1 ? "worker" : "workers"} running`
            : (tasks.length ? idle : "");
          group.setAttribute("aria-label",
            `${places[state].title}: ${tasks.length} ${tasks.length === 1 ? "task" : "tasks"}`);
        }
        const counts = countByState(snapshot.tasks);
        Object.assign(targets, counts);
        for (const edge of flow.querySelectorAll(".edge")) {
          const [from] = edge.dataset.edge.split(">");
          const source = edge.dataset.edge === "shortcut" ? counts.investigation + counts.implementation + counts.initial
            : counts[from];
          edge.classList.toggle("idle", !source);
        }
        tween();
        renderDetail(chosen);
      }

      function tween() {
        if (tweening) return;
        tweening = true;
        const started = performance.now();
        const origin = { ...shown };
        const step = (now) => {
          const progress = reduced ? 1 : Math.min(1, (now - started) / 700);
          for (const state of states) {
            shown[state] = Math.round(origin[state] + (targets[state] - origin[state]) * progress);
            nodeOf(state).querySelector(".count").textContent = String(shown[state]);
          }
          if (progress < 1) requestAnimationFrame(step);
          else tweening = false;
        };
        requestAnimationFrame(step);
      }

      function routeFor(hop) {
        if (hop.from === null) return `M-40,${centre(hop.to).y} L${places[hop.to].x},${centre(hop.to).y}`;
        const key = `${hop.from}>${hop.to}`;
        if (flowRoutes[key]) return flowRoutes[key];
        if (hop.to === "resolved") return SHORTCUT;
        if (hop.from === "blocked") {
          const reverse = flowRoutes[`${hop.to}>blocked`];
          if (reverse) return reverse;
        }
        const a = centre(hop.from);
        const b = centre(hop.to);
        return `M${a.x},${a.y} L${b.x},${b.y}`;
      }

      function bump(state) {
        const group = nodeOf(state);
        group.classList.remove("bump");
        void group.getBoundingClientRect();
        group.classList.add("bump");
      }

      function flyNext() {
        const hop = queue.shift();
        if (!hop) {
          flying = false;
          return;
        }
        flying = true;
        const layer = flow.querySelector("#tokens");
        const path = svg("path", { d: routeFor(hop), fill: "none", visibility: "hidden" });
        const token = svg("circle", { r: 8, class: "token", fill: `var(--${hop.to})` });
        layer.append(path, token);
        const length = path.getTotalLength();
        const started = performance.now();
        const duration = 1300;
        const step = (now) => {
          const progress = Math.min(1, (now - started) / duration);
          const point = path.getPointAtLength(length * (1 - (1 - progress) ** 3));
          token.setAttribute("cx", point.x);
          token.setAttribute("cy", point.y);
          if (progress < 1) {
            requestAnimationFrame(step);
          } else {
            path.remove();
            token.remove();
            bump(hop.to);
          }
        };
        requestAnimationFrame(step);
        setTimeout(flyNext, 350);
      }

      function animate(hops) {
        if (reduced) return;
        queue.push(...hops.slice(-20));
        if (!flying) flyNext();
      }

      function age(time) {
        const seconds = Math.max(0, Math.floor((Date.now() - Date.parse(time)) / 1000));
        if (seconds < 60) return `${seconds}s`;
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `${minutes}m`;
        const hours = Math.floor(minutes / 60);
        if (hours < 48) return `${hours}h ${minutes % 60}m`;
        return `${Math.floor(hours / 24)}d`;
      }

      function reference(href) {
        const url = githubURL(href);
        const node = link(`#${url.pathname.split("/").pop()}`, url.href);
        node.title = url.href;
        return node;
      }

      function taskCard(task, expanded) {
        const node = element("article", null, "card");
        node.style.setProperty("--c", `var(--${task.state})`);
        const cycles = cyclesOf(task);
        node.append(
          element("p", `${snapshot.project} / ${task.id}`, "muted"),
          element("h3", task.title),
        );
        const chips = element("p", null, "chips");
        chips.append(element("span", `${task.state} for ${age(entered(task))}`, "chip state"));
        if (cycles) chips.append(element("span", `${cycles} review ${cycles === 1 ? "cycle" : "cycles"}`, "chip"));
        for (const [label, sha] of [["head", task.head], ["reviewed", task.reviewed_head]]) {
          if (!sha) continue;
          const chip = element("span", `${label} `, "chip");
          chip.append(element("code", sha.slice(0, 7)));
          chips.append(chip);
        }
        node.append(chips);
        if (task.blocker) {
          node.append(element("p", `Blocked in ${task.blocker.from}: ${task.blocker.reason}`, "blocker"));
        }
        if (task.resolution) {
          node.append(element("p", `Resolved: ${task.resolution.outcome}${task.resolution.note ? `. ${task.resolution.note}` : ""}`));
        }
        if (task.pr && task.state !== "resolved") {
          const merge = task.merge
            ? `Merge decision recorded for ${task.merge.authorized_by} (${task.merge.source}) ${age(task.merge.authorized_at)} ago${task.merge.requested_at ? "; landing requested" : ""}`
            : "Merge: no current-head decision recorded";
          node.append(element("p", merge));
        }
        node.append(element("p", `Next: ${task.next_action}`));

        const workers = Object.entries(task.workers).filter(([, worker]) => worker);
        if (workers.length) {
          const list = element("ul", null, "workers");
          for (const [role, worker] of workers) {
            const item = element("li");
            const dot = element("span", null, `dot ${worker.status}`);
            item.append(dot, `${role}: ${worker.status}${worker.name ? `, ${worker.name}` : ""}${worker.pane ? `, ${worker.pane}` : ""} `);
            for (const field of ["brief", "result"]) {
              if (worker[field]) {
                const query = new URLSearchParams({ file: selection, name: artifactName(worker[field], field) });
                item.append(link(field, `/api/artifact?${query}`), " ");
              }
            }
            list.append(item);
          }
          node.append(list);
        }
        if (task.worktree) node.append(element("p", `Worktree: ${task.worktree.path}`, "muted"));

        const links = element("p", null, "links");
        const references = new Set([...(task.issue ? [task.issue] : []), ...(task.pr ? [task.pr] : []), ...task.links]);
        for (const href of references) links.append(reference(href));
        node.append(links);

        const timeline = element("details");
        timeline.dataset.taskId = `${task.id}:history`;
        timeline.open = expanded.has(timeline.dataset.taskId);
        const items = element("ol", null, "history");
        for (const item of task.history) {
          items.append(element("li", `${item.state}, ${item.at}${item.note ? `: ${item.note}` : ""}`));
        }
        timeline.append(element("summary", `History (${task.history.length})`), items);
        node.append(timeline);
        if (task.details && Object.keys(task.details).length) {
          const details = element("details");
          details.dataset.taskId = task.id;
          details.open = expanded.has(task.id);
          details.append(element("summary", "Evidence and task details"),
            element("pre", JSON.stringify(task.details, null, 2)));
          node.append(details);
        }
        return node;
      }

      function renderDetail(state) {
        const panel = document.getElementById("detail");
        if (!state) {
          panel.hidden = true;
          panel.replaceChildren();
          return;
        }
        const expanded = new Set([...panel.querySelectorAll("details[open]")].map((node) => node.dataset.taskId));
        const tasks = snapshot.tasks.filter((task) => task.state === state)
          .sort((a, b) => Date.parse(entered(a)) - Date.parse(entered(b)));
        const head = element("div", null, "detail-head");
        const close = element("button", "Back to flow");
        close.type = "button";
        close.addEventListener("click", () => choose(state));
        const title = element("h2", places[state].title);
        title.append(element("span", String(tasks.length), "counter"));
        head.append(title, close);
        const cards = element("div", null, "cards");
        for (const task of tasks) cards.append(taskCard(task, expanded));
        panel.replaceChildren(head, tasks.length ? cards : element("p", "No tasks in this state.", "muted"));
        panel.hidden = false;
      }

      async function getJSON(path) {
        const response = await fetch(path, { cache: "no-store" });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error ?? `HTTP ${response.status}`);
        return data;
      }

      async function discover() {
        const data = await getJSON("/api/factories");
        const signature = JSON.stringify([selection, data.factories.map((item) => [item.file, item.task_count])]);
        if (signature !== listedChoices) {
          const selector = document.getElementById("factory");
          const placeholder = element("option", data.factories.length ? "Choose a factory..." : "No valid factories found");
          placeholder.value = "";
          const choices = data.factories.map((item) => {
            const option = element("option", `${item.project} / ${item.task_count} ${item.task_count === 1 ? "task" : "tasks"}`);
            option.value = item.file;
            return option;
          });
          if (selection && !data.factories.some((item) => item.file === selection)) {
            const missing = element("option", `Unavailable: ${selection}`);
            missing.value = selection;
            choices.unshift(missing);
          }
          selector.replaceChildren(placeholder, ...choices);
          selector.value = selection;
          listedChoices = signature;
        }
        document.getElementById("skipped").hidden = !data.errors.length;
        document.getElementById("skipped-files").replaceChildren(
          ...data.errors.map((error) => element("li", `${error.file}: ${error.error}`)),
        );
        document.getElementById("discovery-error").hidden = true;
        return data;
      }

      function freshness() {
        if (!snapshot) return;
        const seconds = Math.max(0, Math.floor((Date.now() - Date.parse(snapshot.updated_at)) / 1000));
        document.getElementById("freshness").textContent =
          `Snapshot: ${snapshot.updated_at} (${seconds}s ago). Last successful read: ${lastRead}. Shows saved factory state, not live worker telemetry.`;
      }

      function showError(cause) {
        const error = document.getElementById("error");
        error.textContent = `Read failed: ${cause.message} ${lastSource
          ? `Showing the last successful snapshot of ${lastSource}; it may be stale.`
          : "No snapshot loaded."}`;
        error.hidden = false;
      }

      function load(data, file) {
        const sameSource = file === lastSource;
        const before = sameSource ? snapshot : null;
        const hops = before ? hopsSince(data.tasks, cutoff) : [];
        snapshot = data;
        cutoff = data.tasks.flatMap((task) => task.history.map((item) => item.at))
          .reduce((latest, at) => (Date.parse(at) > Date.parse(latest) ? at : latest), "1970-01-01T00:00:00Z");
        if (!sameSource) {
          for (const state of states) shown[state] = 0;
          queue.length = 0;
          for (const group of flow.querySelectorAll(".pop")) {
            group.classList.remove("pop");
            void group.getBoundingClientRect();
            group.classList.add("pop");
          }
        }
        document.getElementById("goal").textContent = `Factory: ${data.project}`;
        document.getElementById("run-state").textContent =
          `${data.id} / ${data.status} / ${data.tasks.length} ${data.tasks.length === 1 ? "task" : "tasks"}`;
        document.title = `${data.project} - Factory`;
        draw();
        animate(hops);
      }

      async function refresh() {
        if (refreshing) {
          pendingRefresh = true;
          return;
        }
        refreshing = true;
        clearTimeout(refreshTimer);
        try {
          let listing = null;
          try {
            listing = await discover();
          } catch (cause) {
            const error = document.getElementById("discovery-error");
            error.textContent = `Could not list factories: ${cause.message}`;
            error.hidden = false;
          }
          if (!selection && listing?.factories.length) {
            selection = listing.factories[0].file;
            const url = new URL(location.href);
            url.searchParams.set("file", selection);
            history.replaceState(null, "", url);
            listedChoices = "";
            await discover();
          }
          const current = selection;
          if (current) {
            try {
              const data = await getJSON(`/api/factory?${new URLSearchParams({ file: current })}`);
              validate(data);
              if (current === selection) {
                load(data, current);
                lastSource = current;
                lastRead = new Date().toISOString();
                document.getElementById("error").hidden = true;
              }
            } catch (cause) {
              if (current === selection) showError(cause);
            }
          }
        } finally {
          refreshing = false;
          freshness();
          if (pendingRefresh) {
            pendingRefresh = false;
            return refresh();
          }
          refreshTimer = setTimeout(refresh, 10000);
        }
      }

      document.getElementById("factory").addEventListener("change", () => {
        selection = document.getElementById("factory").value;
        const url = new URL(location.href);
        if (selection) url.searchParams.set("file", selection);
        else url.searchParams.delete("file");
        url.hash = "";
        history.replaceState(null, "", url);
        snapshot = lastSource = null;
        return refresh();
      });
      document.getElementById("refresh").addEventListener("click", refresh);
      window.addEventListener("hashchange", draw);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && openState()) {
          history.replaceState(null, "", `${location.pathname}${location.search}`);
          draw();
        }
      });

      buildFlow();
      refresh();
    </script>
  </body>
</html>
